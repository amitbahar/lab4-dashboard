<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Traffic</title>
<style>
:root {
  color-scheme: light;
  --bg: #f4f4f1; --panel: #fcfcfb; --panel2: #efeee9; --border: #dcdbd5; --border2: #c9c8c0;
  --text: #0b0b0b; --muted: #52514e; --faint: #85847e;
  --link: #1c64bd;
  --acc-prompt: #2a78d6; --acc-model: #1baf7a; --acc-thinking: #6250d6; --acc-reminder: #a3a29b;
  --acc-call: #eb6834; --acc-result: #6b6a64; --acc-media: #e87ba4;
  --bad: #c8302f; --bad-bg: #fcebea; --ok: #1f7a3a; --warn: #a86400; --warn-bg: #fff4dc;
  --sec-system: #6250d6; --sec-tools: #eda100; --sec-history: #a3a29b; --sec-new: #2a78d6;
  --sec-reply: #1baf7a; --sec-changes: #eb6834; --sec-stats: #008300; --sec-raw: #6b6a64;
  --series-1: #2a78d6;
  --diff-add: #e3f6e8; --diff-del: #fbe6e6;
  --fresh: #fff3c4; --sel: #e4eefb;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, Ubuntu, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #141413; --panel: #1c1c1b; --panel2: #252524; --border: #34342f; --border2: #45453f;
    --text: #f0efec; --muted: #c3c2b7; --faint: #8f8e86; --link: #7fb3f5;
    --acc-prompt: #3987e5; --acc-model: #199e70; --acc-thinking: #9085e9; --acc-reminder: #6d6c66;
    --acc-call: #d95926; --acc-result: #9a998f; --acc-media: #d55181;
    --bad: #ee6b6a; --bad-bg: #3a1d1c; --ok: #5cc27a; --warn: #e0a33a; --warn-bg: #3a2d12;
    --sec-system: #9085e9; --sec-tools: #c98500; --sec-history: #6d6c66; --sec-new: #3987e5;
    --sec-reply: #199e70; --sec-changes: #d95926; --sec-stats: #2f9a2f; --sec-raw: #9a998f;
    --series-1: #3987e5; --diff-add: #1c3324; --diff-del: #3d2020; --fresh: #3d3410; --sel: #1f2c3d;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #141413; --panel: #1c1c1b; --panel2: #252524; --border: #34342f; --border2: #45453f;
  --text: #f0efec; --muted: #c3c2b7; --faint: #8f8e86; --link: #7fb3f5;
  --acc-prompt: #3987e5; --acc-model: #199e70; --acc-thinking: #9085e9; --acc-reminder: #6d6c66;
  --acc-call: #d95926; --acc-result: #9a998f; --acc-media: #d55181;
  --bad: #ee6b6a; --bad-bg: #3a1d1c; --ok: #5cc27a; --warn: #e0a33a; --warn-bg: #3a2d12;
  --sec-system: #9085e9; --sec-tools: #c98500; --sec-history: #6d6c66; --sec-new: #3987e5;
  --sec-reply: #199e70; --sec-changes: #d95926; --sec-stats: #2f9a2f; --sec-raw: #9a998f;
  --series-1: #3987e5; --diff-add: #1c3324; --diff-del: #3d2020; --fresh: #3d3410; --sel: #1f2c3d;
}
* { box-sizing: border-box; }
html, body, #listScroll, #detailScroll, .logbox { overflow-anchor: none; }  /* anchoring is done by keepAnchor() */
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font: 13px/1.45 var(--sans); display: flex; flex-direction: column; overflow: hidden; }
a, .link { color: var(--link); cursor: pointer; text-decoration: none; }
a:hover, .link:hover { text-decoration: underline; }
button { font: inherit; color: inherit; background: var(--panel2); border: 1px solid var(--border); border-radius: 5px; padding: 2px 8px; cursor: pointer; }
button:hover { border-color: var(--border2); }
pre { margin: 0; white-space: pre-wrap; word-break: break-word; }
.mono, code, pre.code { font-family: var(--mono); font-size: 12px; }
.muted { color: var(--muted); }
.faint { color: var(--faint); }
.bad { color: var(--bad); }
.ok { color: var(--ok); }
.warn { color: var(--warn); }
kbd { font-family: var(--mono); font-size: 11px; border: 1px solid var(--border2); border-bottom-width: 2px; border-radius: 3px; padding: 0 3px; }

/* ---------- header ---------- */
#top { flex: none; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--border); }
#conn { font-weight: 600; }
#conn.live::before { content: "● "; color: var(--ok); }
#conn.down::before { content: "● "; color: var(--bad); }
#inflight, #totals { color: var(--muted); }
#totals b { color: var(--text); font-weight: 600; }
.spacer { flex: 1; }
#errBtn.has { background: var(--bad-bg); border-color: var(--bad); color: var(--bad); font-weight: 600; }
#errBtn.active { outline: 2px solid var(--bad); }
#statsPanel { flex: none; max-height: 45vh; overflow: auto; background: var(--panel); border-bottom: 1px solid var(--border); padding: 12px 16px;
  display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 16px; }
#statsPanel[hidden] { display: none; }
#statsPanel h3 { margin: 0 0 6px; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
table.t { border-collapse: collapse; width: 100%; font-size: 12px; }
table.t th, table.t td { text-align: left; padding: 2px 8px 2px 0; border-bottom: 1px solid var(--border); vertical-align: top; }
table.t th { color: var(--muted); font-weight: 500; }
table.t td.n, table.t th.n { text-align: right; font-variant-numeric: tabular-nums; }
table.t tr.click { cursor: pointer; }
table.t tr.click:hover td { background: var(--panel2); }
table.t tr.sel td { background: var(--panel2); font-weight: 600; }

/* ---------- two panes ---------- */
#panes { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(340px, 40%) minmax(0, 1fr); }
.pane { min-height: 0; min-width: 0; display: flex; flex-direction: column; }
#listPane { border-right: 1px solid var(--border); position: relative; }
#controls { flex: none; padding: 8px 12px; border-bottom: 1px solid var(--border); background: var(--panel); font-size: 12px; }
.ctlbar { display: flex; gap: 6px; align-items: center; }
.ctlbar input[type=search] { flex: 1; min-width: 0; font: inherit; color: inherit; background: var(--bg); border: 1px solid var(--border); border-radius: 5px; padding: 3px 6px; }
#ctlCount:empty { display: none; }
#ctlCount { color: var(--acc-prompt); font-weight: 600; }
#ctlBody { padding-top: 6px; max-height: 40vh; overflow: auto; display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 4px 16px; }
#ctlBody[hidden] { display: none; }
#ctlBody h4 { margin: 6px 0 3px; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
#ctlBody label { display: flex; align-items: center; gap: 6px; padding: 1px 0; cursor: pointer; }
#ctlBody .sesshead { font-weight: 600; margin-top: 4px; }
#ctlBody .toolrow { display: flex; justify-content: space-between; gap: 6px; padding: 1px 4px; border-radius: 4px; cursor: pointer; }
#ctlBody .toolrow:hover { background: var(--panel2); }
#ctlBody .toolrow.sel { background: var(--panel2); outline: 1px solid var(--border2); font-weight: 600; }
#ctlBody .keys { color: var(--faint); line-height: 1.7; }
#listScroll { flex: 1; min-height: 0; overflow: auto; padding: 8px 10px 24px; }
#list:focus { outline: none; }
#pill { position: absolute; top: 52px; left: 50%; transform: translateX(-50%); z-index: 10; background: var(--acc-prompt); color: #fff;
  border: none; border-radius: 999px; padding: 4px 14px; font-weight: 600; box-shadow: 0 2px 8px rgba(0,0,0,.2); }
#pill[hidden] { display: none; }
#empty { color: var(--muted); padding: 30px 10px; text-align: center; }
#evictNote { color: var(--faint); text-align: center; padding: 12px; }
#detailHead { flex: none; padding: 8px 14px; border-bottom: 1px solid var(--border); background: var(--panel); display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; }
#detailHead .big { font-size: 15px; font-weight: 700; }
#detailNotice:empty { display: none; }
#detailNotice { flex: none; margin: 8px 14px 0; padding: 5px 10px; border-radius: 5px; background: var(--warn-bg); border: 1px solid var(--warn); color: var(--warn); font-weight: 600; display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
#detailScroll { flex: 1; min-height: 0; overflow: auto; padding: 4px 14px 30px; }
#detailScroll:focus { outline: none; }
.placeholder { color: var(--muted); padding: 40px 10px; text-align: center; }
#backBtn { display: none; }
@media (max-width: 900px) {
  #panes { grid-template-columns: minmax(0, 1fr); }
  #listPane { border-right: none; }
  body.show-detail #listPane { display: none; }
  body:not(.show-detail) #detailPane { display: none; }
  #backBtn { display: inline-block; }
}

/* ---------- list rows ---------- */
.item { background: var(--panel); border: 1px solid var(--border); border-radius: 7px; margin-bottom: 6px; cursor: pointer; user-select: text; }
.item.fresh { animation: fresh 1.6s ease-out; }
@keyframes fresh { from { background: var(--fresh); } }
.item.flash { animation: fresh 1.2s ease-out; }
.item.haserr { border-left: 4px solid var(--bad); }
.item.sel { background: var(--sel); border-color: var(--acc-prompt); box-shadow: inset 3px 0 0 var(--acc-prompt); }
.row { padding: 2px 10px; display: flex; flex-wrap: wrap; align-items: baseline; gap: 3px 8px; min-width: 0; }
.row.head { padding-top: 6px; }
.row.replyrow { padding-bottom: 6px; }
.rowlab { font-size: 10px; font-weight: 700; letter-spacing: .06em; color: var(--faint); width: 40px; flex: none; }
.kind-nonmsg .row.head, .kind-generic .row.head { padding-bottom: 6px; }
.kind-nonmsg .newrow, .kind-nonmsg .replyrow, .kind-generic .newrow, .kind-generic .replyrow { display: none; }
.kind-nonmsg { opacity: .85; }
.id { font-weight: 700; font-variant-numeric: tabular-nums; }
.chip { display: inline-block; padding: 0 6px; border-radius: 4px; background: var(--panel2); border: 1px solid var(--border); font-size: 11.5px; white-space: nowrap; }
.chip.okc { color: var(--ok); }
.chip.badc { color: var(--bad); border-color: var(--bad); background: var(--bad-bg); font-weight: 600; }
.chip.warnc { color: var(--warn); border-color: var(--warn); background: var(--warn-bg); }
.chip.state-done { color: var(--muted); }
.chip.state-live { color: var(--acc-prompt); border-color: var(--acc-prompt); }
.ttag { display: inline-block; padding: 0 6px; border-radius: 4px; font-size: 11.5px; font-weight: 600; border: 1px solid var(--tc); color: var(--text);
  background: color-mix(in srgb, var(--tc) 14%, transparent); white-space: nowrap; }
.stag { display: inline-block; padding: 0 5px; border-radius: 4px; font-size: 11px; font-family: var(--mono); border: 1px dashed var(--border2); color: var(--muted); white-space: nowrap; }
.num { font-variant-numeric: tabular-nums; color: var(--muted); white-space: nowrap; }
.sumtxt { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%; }
.sumrow { display: flex; flex-wrap: wrap; gap: 3px 8px; min-width: 0; flex: 1; }
.tchip { display: inline-flex; gap: 4px; align-items: baseline; padding: 0 6px; border-radius: 4px; border: 1px solid var(--acc-call);
  font-size: 12px; max-width: 360px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.tchip .arg { font-family: var(--mono); font-size: 11.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; }
.tchip.err { border-color: var(--bad); background: var(--bad-bg); }
.cursor { display: inline-block; width: .55em; height: 1.05em; vertical-align: text-bottom; background: var(--acc-model); animation: blink 1s steps(2) infinite; margin-left: 1px; }
@keyframes blink { 50% { opacity: 0; } }
.errbanner:empty { display: none; }
.errbanner { margin: 4px 10px 7px; padding: 4px 9px; background: var(--bad-bg); color: var(--bad); border: 1px solid var(--bad); border-radius: 5px; font-weight: 600; }
.errbanner div + div { margin-top: 2px; }

/* ---------- sections ---------- */
.sec { border: 1px solid var(--border); border-left: 4px solid var(--acc); border-radius: 6px; margin: 8px 0; background: var(--panel); }
.sechead { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; padding: 5px 10px; cursor: pointer; background: color-mix(in srgb, var(--acc) 9%, var(--panel)); border-radius: 0 5px 5px 0; }
.sec.open > .sechead { border-bottom: 1px solid var(--border); border-radius: 0 5px 0 0; }
.sechead .t { font-weight: 650; }
.sechead .hint { color: var(--muted); font-size: 12px; }
.secbody { padding: 8px 10px 10px; min-width: 0; }
.caret { display: inline-block; width: 1em; color: var(--faint); flex: none; }
.acc-system { --acc: var(--sec-system); } .acc-tools { --acc: var(--sec-tools); } .acc-history { --acc: var(--sec-history); }
.acc-new { --acc: var(--sec-new); } .acc-reply { --acc: var(--sec-reply); } .acc-changes { --acc: var(--sec-changes); }
.acc-stats { --acc: var(--sec-stats); } .acc-raw { --acc: var(--sec-raw); }
.tag { display: inline-block; font-size: 10.5px; padding: 0 5px; border-radius: 3px; border: 1px solid var(--border2); color: var(--muted); font-family: var(--mono); }
.fold { margin: 4px 0; }
.foldhead { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: baseline; cursor: pointer; padding: 2px 0; min-width: 0; }
.foldhead:hover { background: var(--panel2); }
.foldbody { padding: 4px 0 4px 16px; min-width: 0; }
.sysblock + .sysblock { margin-top: 10px; padding-top: 8px; border-top: 1px dashed var(--border); }
.lt { min-width: 0; }
.lt pre.prose { font-family: var(--sans); font-size: 13px; }
.more { margin-top: 4px; font-size: 11.5px; padding: 0 8px; color: var(--link); background: transparent; }
.copy { font-size: 11px; padding: 0 6px; }
.prov { font-size: 10.5px; font-weight: 600; color: var(--warn); border: 1px solid var(--warn); border-radius: 3px; padding: 0 4px; }

/* ---------- message vocabulary ---------- */
.msgs { display: flex; flex-direction: column; gap: 6px; }
.blk { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.msg { border-left: 3px solid var(--acc); padding: 3px 10px 4px; min-width: 0; }
.mlabel { font-size: 11px; font-weight: 700; color: var(--muted); letter-spacing: .03em; margin-bottom: 2px; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.k-prompt { --acc: var(--acc-prompt); background: color-mix(in srgb, var(--acc-prompt) 6%, transparent); }
.k-model { --acc: var(--acc-model); }
.k-reminder { --acc: var(--acc-reminder); border-left-style: dotted; margin-left: 18px; color: var(--muted); font-size: 12px; }
.k-thinking { --acc: var(--acc-thinking); border-left-style: dashed; margin-left: 18px; color: var(--muted); }
.k-result { --acc: var(--acc-result); margin-left: 18px; }
.k-result.err { --acc: var(--bad); }
.k-media { --acc: var(--acc-media); margin-left: 18px; font-size: 12px; }
.k-echo { --acc: var(--border2); color: var(--muted); font-size: 12px; }
.k-other { --acc: var(--border2); margin-left: 18px; }
body.hide-thinking .k-thinking, body.hide-thinking .sum-thinking { display: none; }
body.hide-reminders .k-reminder, body.hide-reminders .sum-reminder { display: none; }
.md p { margin: 0 0 6px; } .md p:last-child { margin-bottom: 0; }
.md ul, .md ol { margin: 2px 0 6px; padding-left: 22px; }
.md h3, .md h4, .md h5 { margin: 8px 0 4px; font-size: 13.5px; }
.md code { background: var(--panel2); padding: 0 3px; border-radius: 3px; }
.md pre.code { background: var(--panel2); padding: 6px 8px; border-radius: 4px; margin: 4px 0 6px; overflow-x: auto; }

/* ---------- tool call beside result ---------- */
.pair { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); border: 1px solid var(--border); border-radius: 6px; margin: 2px 0 2px 8px; }
.pair.err { border-color: var(--bad); box-shadow: 0 0 0 1px var(--bad); }
.pcall, .pres { padding: 5px 10px 7px; min-width: 0; }
.pcall { border-left: 3px solid var(--acc-call); border-radius: 5px 0 0 5px; }
.pres { border-left: 1px solid var(--border); background: color-mix(in srgb, var(--acc-result) 5%, transparent); }
.pair.err .pres { background: var(--bad-bg); }
.phead { font-size: 12px; font-weight: 650; margin-bottom: 3px; display: flex; gap: 6px; flex-wrap: wrap; align-items: baseline; }
.phead .sub { font-weight: 400; color: var(--muted); }
.cid { font-family: var(--mono); font-size: 10.5px; color: var(--faint); font-weight: 400; }
.kv { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 1px 8px; font-size: 12px; }
.kv .k { color: var(--muted); font-family: var(--mono); font-size: 11.5px; }
.waiting { color: var(--muted); font-style: italic; }
@container (max-width: 640px) { .pair { grid-template-columns: minmax(0, 1fr); } .pres { border-left: none; border-top: 1px solid var(--border); } }
#detailScroll { container-type: inline-size; }

/* ---------- json ---------- */
.json { font-family: var(--mono); font-size: 12px; position: relative; background: var(--bg); border: 1px solid var(--border); border-radius: 5px; padding: 4px 8px; overflow-x: auto; }
.json > .copy { position: absolute; right: 4px; top: 4px; }
.jkids { padding-left: 16px; border-left: 1px dotted var(--border2); margin-left: 4px; }
.jrow { white-space: pre-wrap; word-break: break-word; }
.jtog { cursor: pointer; }
.jtog:hover { background: var(--panel2); }
.jk { color: var(--sec-system); }
.js { color: var(--ok); }
.jn { color: var(--acc-call); }
.jb { color: var(--acc-prompt); }
.jcount, .jnote { color: var(--faint); font-style: italic; }

/* ---------- event log ---------- */
.lognote { font-size: 11.5px; color: var(--warn); margin: 2px 0 4px; }
.logbox { max-height: 340px; overflow: auto; border: 1px solid var(--border); border-radius: 5px; background: var(--bg); font-family: var(--mono); font-size: 11.5px; padding: 2px 6px; }
.logrow .foldhead { gap: 2px 8px; }
.logrow .seq { color: var(--faint); min-width: 3.5em; text-align: right; }
.logrow .lt0 { color: var(--faint); min-width: 5em; }
.logrow .ev { font-weight: 600; }
.logrow .ev.e-err { color: var(--bad); }
.logrow .ev.e-end { color: var(--ok); }
.lognew { margin-top: 4px; font-size: 11.5px; }

/* ---------- diff ---------- */
.diff { font-family: var(--mono); font-size: 12px; border: 1px solid var(--border); border-radius: 5px; overflow-x: auto; }
.diff div { white-space: pre-wrap; word-break: break-word; padding: 0 6px; }
.diff .a { background: var(--diff-add); } .diff .a::before { content: "+ "; color: var(--ok); }
.diff .d { background: var(--diff-del); } .diff .d::before { content: "- "; color: var(--bad); }
.diff .c::before { content: "  "; }
.diff .gap { color: var(--faint); font-style: italic; background: var(--panel2); }
.chg { margin: 4px 0 10px; }
.chg > .lbl { font-weight: 650; margin-bottom: 3px; }
.warnbox { background: var(--warn-bg); border: 1px solid var(--warn); color: var(--warn); border-radius: 5px; padding: 4px 8px; font-weight: 600; margin: 4px 0; }

/* ---------- charts ---------- */
.chart { position: relative; }
.chart svg { display: block; width: 100%; overflow: visible; }
.chart .bar { fill: var(--series-1); }
.chart .hit { fill: transparent; cursor: pointer; }
.chart .hit:hover + .bar { opacity: .75; }
.chart .axis { stroke: var(--border2); stroke-width: 1; }
.chart .axl { fill: var(--muted); font-size: 10.5px; font-family: var(--sans); }
#tip { position: fixed; z-index: 50; pointer-events: none; background: var(--panel); border: 1px solid var(--border2); border-radius: 5px; padding: 4px 8px; font-size: 12px; box-shadow: 0 2px 8px rgba(0,0,0,.18); }
#tip[hidden] { display: none; }
#toast { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); z-index: 60; background: var(--text); color: var(--bg); padding: 6px 14px; border-radius: 6px; }
#toast[hidden] { display: none; }
</style>
</head>
<body>
<header id="top">
  <span id="conn" class="down">connecting…</span>
  <span id="inflight"></span>
  <span class="spacer"></span>
  <span id="totals"></span>
  <button id="errBtn" title="Show only requests with errors (e / Shift+E: next / previous error)">Errors 0</button>
  <button id="statsBtn">Stats ▾</button>
  <button id="themeBtn" title="Theme: auto / light / dark">◐ auto</button>
</header>
<div id="statsPanel" hidden></div>
<div id="panes">
  <section id="listPane" class="pane" aria-label="Requests">
    <div id="controls">
      <div class="ctlbar">
        <input id="search" type="search" placeholder="Search new messages and replies  ( / )" aria-label="Search">
        <button id="ctlToggle" aria-expanded="false" aria-controls="ctlBody">Filters ▾</button>
        <span id="ctlCount"></span>
      </div>
      <div id="ctlBody" hidden>
        <div id="ctlThreads"></div>
        <div id="ctlTools"></div>
        <div>
          <h4>Kinds</h4>
          <label><input type="checkbox" id="kThinking" checked> 💭 thinking</label>
          <label><input type="checkbox" id="kReminders" checked> 🔔 reminders</label>
          <h4>Other</h4>
          <label><input type="checkbox" id="fErrors"> ⚠ errors only</label>
          <label><input type="checkbox" id="fNonMsg"> non-message requests <span id="nonMsgCount" class="faint"></span></label>
        </div>
        <div>

// =====================================================================

function handle(name, d) {

// --- dashboard event log (bounded; consecutive deltas of one block are coalesced) ---
function logEvent(ex, name, d) {
  const L = ex.log;

    const piece = d.text ?? d.thinking ?? d.partial_json ?? '';

  return blocksOf(m).filter(b => b.type === 'text').map(b => stripReminders(b.text)).join('\n').trim();

function newThread(kind, ex) {
  const sess = S.sessions.get(ex.session);
  let name, suffix;

// Work out which thread of its session a message request belongs to, and what is new in it.

  }
  if (b.type === 'image' || b.type === 'document') return mediaEl(b);
  return fold(key, false, [`▫ ${b.type}`], () => jsonTree(key + ':j', b, 2), 'msg k-other');
}

function assistantBlock(ex, b, key, { local, live } = {}) {
  if (!b) return '';
  if (b.type === 'text') {
    if (live && !b.done)  // provisional: plain text while it streams, Markdown once complete
      return h('div', { class: 'msg k-model' }, label('🤖', 'Model', span('prov', 'streaming — provisional')), longText(key, b.text || '', { lines: 60, maxChars: 12000, cursor: true }));
    return h('div', { class: 'msg k-model' }, label('🤖', 'Model'), longText(key, b.text || '', { md: true, lines: 60, maxChars: 12000 }));
  }
  if (b.type === 'thinking') {
    const txt = b.thinking || '';
    return fold(key, false, () => [h('span', { class: 'mlabel', style: 'margin:0' }, '💭 thinking'), h('span', { class: 'faint' }, fmtChars(txt.length)), live && !b.done ? h('span', { class: 'cursor' }) : ''],
      () => longText(key + ':t', txt || '(empty — the thinking text was not returned)', { lines: 40 }), 'msg k-thinking');
  }
  if (b.type === 'redacted_thinking') return h('div', { class: 'msg k-thinking' }, '💭 redacted');
  if (b.type === 'tool_use') {
    const lr = local?.get(b.id);
    return pairEl(ex, b, key, lr ? { result: lr, exId: null } : null, live);
  }
  return fold(key, false, [`▫ ${b.type}`, b.name ? ' · ' + b.name : ''], () => jsonTree(key + ':j', b, 2), 'msg k-other');
}

function inputView(key, b, live) {
  const input = b.input;
  const streaming = live && !b.done;
  if (streaming || (b.incomplete && (input === undefined || (input && !Object.keys(input).length)))) {
    // Provisional: fragments of the tool input as they arrive; never parsed until complete.
    return h('div', null, h('div', { class: 'mlabel' }, span('prov', streaming ? 'input arriving — provisional' : 'input incomplete — the reply ended before it finished')),
      h('pre', { class: 'mono' }, b.partial || '…', streaming ? h('span', { class: 'cursor' }) : ''));
  }
  if (input && typeof input === 'object' && '_partial_json' in input) {
    let why = '';
    try { JSON.parse(input._partial_json); } catch (e) { why = e.message; }
    return h('div', null, h('div', { class: 'warnbox' }, `⚠ the final tool input is not valid JSON${why ? ': ' + why : ''}`), h('pre', { class: 'mono' }, input._partial_json));
  }
  if (input === undefined) return h('span', { class: 'jnote' }, 'input unavailable');
  if (!input || typeof input !== 'object') return jsonTree(key + ':ij', input, 2);
  const kv = h('div', { class: 'kv' });
  for (const [k, v] of Object.entries(input)) {
    kv.append(h('span', { class: 'k' }, k + ':'),
      typeof v === 'string' ? longText(`${key}:in:${k}`, v, { lines: 8, maxChars: 1500, mono: true })
        : h('span', { class: 'mono' }, trunc(JSON.stringify(v), 300)));
  }
  if (!Object.keys(input).length) kv.append(h('span', { class: 'jnote' }, '(no arguments)'));
  return h('div', null, kv, fold(key + ':ij', false, [h('span', { class: 'faint' }, 'input JSON')], () => jsonTree(key + ':ijt', input, 2)));
}

function pairEl(ex, b, key, localRes, live, why) {
  const t = S.tools.get(b.id) || {};
  let res = localRes;
  if (!res && t.result && !t.collision) res = { result: t.result, exId: t.resultEx, t: t.resultT };
  const err = !!res?.result?.is_error;
  const name = b.name || t.name || '?';
  const call = S.agentCalls.find(c => c.toolUseId === b.id && c.thread);
  const th = call && S.threads.get(call.thread);
  const left = h('div', { class: 'pcall' },
    h('div', { class: 'phead' }, `▶ ${name}`, h('span', { class: 'cid', title: b.id }, b.id ? '…' + String(b.id).slice(-8) : ''),
      th && th.ids.length ? h('span', { class: 'sub' }, exLink(th.ids[0], `↘ thread ${th.name}`)) : ''),
    why ? h('div', { class: 'warn' }, why) : inputView(key, b, live));
  let right;
  if (t.collision && !localRes) right = h('div', { class: 'pres' }, h('div', { class: 'warnbox' }, '⚠ unresolved: this call ID also appears in another thread or session'));
  else if (res) {
    const callEx = S.ex.get(t.callEx);
    const delay = res.t && callEx?.resp?.tEnd ? res.t - callEx.resp.tEnd : null;
    right = h('div', { class: 'pres' },
      h('div', { class: 'phead' }, '⚙ result', err ? span('bad', '✗ error') : span('ok', '✓'),
        res.exId && res.exId !== ex.id ? h('span', { class: 'sub' }, '(in ', exLink(res.exId), delay != null ? `, +${fmtDur(delay)}` : '', ')') : ''),
      resultBody(key + ':res', res.result),
      fold(key + ':resj', false, [h('span', { class: 'faint' }, 'result JSON')], () => jsonTree(key + ':resjt', res.result, 2)));
  } else if (t.missing) right = h('div', { class: 'pres' }, h('div', { class: 'waiting' }, '✗ no result received'));
  else right = h('div', { class: 'pres' }, h('div', { class: 'waiting' }, b.done || ex.done ? '⏳ waiting for result' : '… call still streaming'));
  return h('div', { class: 'pair' + (err ? ' err' : ''), 'data-tool': name }, left, right);
}

function resultBody(key, block) {
  const c = block?.content;
  const parts = [];
  const text = resultText(block);
  if (Array.isArray(c)) for (const x of c) if (x.type === 'image' || x.type === 'document') parts.push(mediaEl(x));
  parts.unshift(text ? longText(key, Array.isArray(c) ? c.filter(x => x.type === 'text').map(x => x.text).join('\n') || text : text, { lines: 10, maxChars: 3000, mono: true }) : h('span', { class: 'jnote' }, '(empty result)'));
  return parts;
}

// =====================================================================
// List rows (left pane)
// =====================================================================
const listEl = $('#list'), listScroll = $('#listScroll');

function addRow(ex) {
  const row = h('div', { class: 'item kind-' + ex.kind + (ex.fresh ? ' fresh' : ''), 'data-id': ex.id, id: 'row-' + ex.id, role: 'option', 'aria-selected': 'false' });
  ex.dom = { row, head: h('div', { class: 'row head' }), newRow: h('div', { class: 'row newrow' }), reply: h('div', { class: 'row replyrow' }), err: h('div', { class: 'errbanner' }), secs: {} };
  row.append(ex.dom.head, ex.dom.newRow, ex.dom.reply, ex.dom.err);
  // Select on pointerdown + pointerup on the row itself, not on 'click': a streaming row is redrawn many
  // times a second, and a click whose press and release land on replaced elements is dropped by the browser.
  let down = null;
  row.addEventListener('pointerdown', e => {
    down = null;
    if (e.button !== 0 || e.target.closest('a,button,input,.link')) return;
    down = { x: e.clientX, y: e.clientY };
  });
  row.addEventListener('pointerup', e => {
    const d = down; down = null;
    if (!d || e.button !== 0) return;
    if (Math.hypot(e.clientX - d.x, e.clientY - d.y) > 5) return;  // a drag, e.g. selecting text
    if (window.getSelection()?.toString()) return;
    selectEx(ex.id, { reveal: false });
  });
  if (V.selected === ex.id) { row.classList.add('sel'); row.setAttribute('aria-selected', 'true'); }
  renderRows(ex);
  const vis = visible(ex);
  row.hidden = !vis;
  keepListAnchor(() => listEl.prepend(row));
  if (!S.replaying) {
    if (vis && listScroll.scrollTop > 40) { S.pending++; updatePill(); }
    // Select the first visible request only when nothing is selected; arrivals never replace a selection.
    if (vis && V.selected == null) selectEx(ex.id, { reveal: false, show: false });
  }
  if (ex.fresh) setTimeout(() => row.classList.remove('fresh'), 1700);
}

function renderRows(ex) {
  const d = ex.dom;
  d.row.classList.toggle('haserr', hasError(ex));
  d.head.replaceChildren(...headRow(ex));
  if (ex.kind === 'msg') {
    d.newRow.replaceChildren(h('span', { class: 'rowlab' }, 'NEW'), h('span', { class: 'sumrow' }, newSummary(ex)));
    d.reply.replaceChildren(h('span', { class: 'rowlab' }, 'REPLY'), h('span', { class: 'sumrow' }, replySummary(ex)));
  }
  d.err.replaceChildren(...ex.errors.map(e => h('div', null, errSummary(e))));
}

function threadTag(th) {
  if (!th) return '';
  return h('span', { class: 'ttag', style: `--tc:${th.color}`, title: 'session ' + (S.sessions.get(th.session)?.sid || 'unknown') }, th.name);
}
function sessTag(key) {
  const s = S.sessions.get(key);
  return s && multiSession() ? h('span', { class: 'stag', title: 'Claude Code session ' + (s.sid || 'unknown') }, s.label) : '';
}

function headRow(ex) {
  const out = [h('span', { class: 'id' }, '#' + ex.id), span('num', fmtTime(ex.t), new Date(ex.t).toISOString())];
  const status = ex.resp?.status;
  const lat = (ex.resp?.tEnd ?? Date.now()) - ex.t;
  if (ex.kind === 'msg') {
    const th = S.threads.get(ex.thread);
    out.push(sessTag(ex.session), threadTag(th));
    if (th?.startedBy && th.ids[0] === ex.id) out.push(h('span', { class: 'faint' }, exLink(th.startedBy.exId, `↖ started by #${th.startedBy.exId}`)));
    out.push(span('num', shortModel(modelOf(ex)), modelOf(ex)));
  } else {
    out.push(sessTag(ex.session), h('span', { class: 'ttag', style: `--tc:${NEUTRAL}` }, ex.kind === 'generic' ? 'unrecognised API' : 'other'), h('span', { class: 'mono' }, `${ex.method} ${ex.path}`));
  }
  if (status) out.push(span('chip ' + (status >= 400 ? 'badc' : 'okc'), String(status), ex.resp.reason || ''));
  out.push(span('num lat', fmtDur(lat), `${exact(Math.round(lat))} ms total`));
  const u = ex.resp?.usage;
  if (ex.kind === 'msg' && u) {
    out.push(span('num', `${fmtTok(tokIn(u))}/${fmtTok(u.output_tokens || 0)}`,
      `input ${exact(u.input_tokens || 0)} · cache read ${exact(u.cache_read_input_tokens || 0)} · cache write ${exact(u.cache_creation_input_tokens || 0)} · output ${exact(u.output_tokens || 0)}`));
    const c = costOf(ex);
    out.push(span('num', fmtCost(c), c == null ? `no price for ${modelOf(ex)}` : `$${c.toFixed(6)}`));
  }
  out.push(...lifeChips(ex));
  if (ex.kind === 'msg') {
    const P = S.ex.get(ex.prev);
    if (P && (P.sysSig !== ex.sysSig || P.toolsSig !== ex.toolsSig))
      out.push(span('chip warnc', 'Δ ' + [P.sysSig !== ex.sysSig && 'system', P.toolsSig !== ex.toolsSig && 'tools'].filter(Boolean).join('+'), 'changed since #' + P.id));
    if (ex.rewrite) out.push(span('chip warnc', '⚠ rewritten', 'history rewritten'));
  }
  return out;
}

function newSummary(ex) {
  const prompts = [], results = [];
  let reminders = 0, media = 0, assistants = 0;
  for (const m of newMsgs(ex)) {
    if (m.role === 'assistant') { assistants++; continue; }
    for (const b of blocksOf(m)) {
      if (b.type === 'text') for (const p of splitReminders(b.text || '')) { if (p.k === 'prompt') prompts.push(p.text); else reminders++; }
      else if (b.type === 'tool_result') results.push(b);
      else if (b.type === 'image' || b.type === 'document') media++;
    }
  }
  const out = [];
  if (prompts.length) out.push(h('span', { class: 'sumtxt' }, `👤 "${trunc(prompts.map(firstLine).join(' ⏎ '), 140)}"`));
  if (results.length) {
    const items = results.slice(0, 6).map(b => {
      const n = S.tools.get(b.tool_use_id)?.name || '?';
      return h('span', { class: b.is_error ? 'bad' : '' }, `${n} ${b.is_error ? '✗' : '✓'}`);
    });
    const list = []; items.forEach((it, i) => { if (i) list.push(', '); list.push(it); });
    out.push(h('span', null, `⚙ ${results.length} result${results.length > 1 ? 's' : ''}: `, list, results.length > 6 ? ` +${results.length - 6}` : ''));
  }
  if (reminders) out.push(h('span', { class: 'muted sum-reminder' }, `🔔 ${reminders}`));
  if (media) out.push(h('span', { class: 'muted' }, `🖼 ${media}`));
  if (!out.length) out.push(h('span', { class: 'faint' }, assistants ? '(only the previous reply)' : '—'));
  return out;
}

function replySummary(ex) {
  const out = [];
  const blocks = ex.blocks.filter(Boolean);
  const live = !ex.done;
  const text = blocks.find(b => b.type === 'text' && b.text);
  const think = blocks.filter(b => b.type === 'thinking' || b.type === 'redacted_thinking');
  if (think.length) {
    const n = think.reduce((a, b) => a + (b.thinking || '').length, 0);
    out.push(h('span', { class: 'muted sum-thinking' }, think.some(b => b.type === 'redacted_thinking') && !n ? '💭 redacted' : `💭 ${fmtChars(n)}`));
  }
  if (text) out.push(h('span', { class: 'sumtxt' }, `🤖 "${trunc(firstLine(text.text).replace(/\*\*|__|`/g, ''), 160)}"`, live && !text.done ? h('span', { class: 'cursor' }) : ''));
  for (const b of blocks.filter(b => b.type === 'tool_use')) {
    const t = S.tools.get(b.id) || {};
    const arg = mainArg(b.name, b.input, b.partial);
    const mark = t.collision ? ' ⚠' : t.result ? (t.isError ? ' ✗' : ' ✓') : t.missing ? ' ∅' : b.done ? ' ⏳' : ' …';
    out.push(h('span', { class: 'tchip' + (t.isError ? ' err' : ''), title: `${b.name} ${arg}` }, `▶ ${b.name}`, arg ? h('span', { class: 'arg' }, '· ' + arg) : '', mark));
  }
  if (!out.length) out.push(h('span', { class: 'faint' }, ex.errors.length ? 'no reply' : live ? '…' : '(empty)'));
  return out;
}

// =====================================================================
// Detail pane (right)
// =====================================================================
function section(ex, name, def, acc, titleFn, bodyFn) {
  const key = `${ex.id}:sec:${name}`;
  const el = h('section', { class: 'sec ' + acc, 'data-sec': name });
  const draw = () => {
    const open = isOpen(key, def);
    el.classList.toggle('open', open);
    el.replaceChildren(h('div', { class: 'sechead', role: 'button', 'aria-expanded': String(open), onclick: e => { e.stopPropagation(); if (e.target.closest('a,button,.link')) return; UI.set(key, !open); draw(); } },
      h('span', { class: 'caret' }, open ? '▾' : '▸'), safe(titleFn)));
    if (open) el.append(h('div', { class: 'secbody' }, safe(bodyFn)));
  };
  draw();
  ex.dom.secs[name] = draw;
  return el;
}
const SECTION_DEFAULTS = { system: true, tools: false, history: false, new: true, reply: true, changes: false, stats: false, raw: false };
function setAllSections(ex, open) { for (const n of Object.keys(SECTION_DEFAULTS)) UI.set(`${ex.id}:sec:${n}`, open); }

function renderDetail() {
  const body = $('#detailBody'), scroller = $('#detailScroll');
  const id = V.selected, ex = S.ex.get(id);
  V.rendered = null;
  if (id == null) {
    $('#detailHead').replaceChildren(h('span', { class: 'muted' }, 'No request selected'));
    $('#detailNotice').replaceChildren();
    body.replaceChildren(h('div', { class: 'placeholder' }, S.ex.size ? 'Select a request in the list.' : 'Waiting for traffic…'));
    return;
  }
  if (!ex) {
    $('#detailHead').replaceChildren(backBtn(), h('span', { class: 'big' }, '#' + id));
    $('#detailNotice').replaceChildren();
    body.replaceChildren(h('div', { class: 'placeholder' }, S.replaying ? 'Loading…' : `Request #${id} is no longer available: it was evicted from the replay buffer. Select another request in the list.`));
    return;
  }
  renderDetailHead(ex);
  renderBody(ex, body);
  V.rendered = id;
  scroller.scrollTop = V.detailScroll.get(id) || 0;
}
function backBtn() { return h('button', { id: 'backBtn', onclick: () => showList() }, '← list'); }
const isNarrow = () => matchMedia('(max-width: 900px)').matches;
function showList() {
  document.body.classList.remove('show-detail');
  const a = V.narrowAnchor; V.narrowAnchor = null;
  if (a?.id != null) restoreListAnchor(a); else if (a) listScroll.scrollTop = a.top;
  $('#list').focus({ preventScroll: true });
}

function renderDetailHead(ex) {
  const th = S.threads.get(ex.thread);
  $('#detailHead').replaceChildren(...[backBtn(), h('span', { class: 'big' }, '#' + ex.id), span('num', fmtTime(ex.t)),
    ...(ex.kind === 'msg' ? [sessTag(ex.session), threadTag(th), span('num', shortModel(modelOf(ex)), modelOf(ex))] : [h('span', { class: 'mono' }, `${ex.method} ${ex.path}`)]),
    ...lifeChips(ex), span('num lat', fmtDur((ex.resp?.tEnd ?? Date.now()) - ex.t)),
    h('span', { class: 'spacer' }),
    h('button', { title: `Open every section of #${ex.id}`, onclick: () => { setAllSections(ex, true); renderBody(ex, $('#detailBody')); } }, `Expand all sections of #${ex.id}`),
    h('button', { title: `Close every section of #${ex.id}`, onclick: () => { setAllSections(ex, false); renderBody(ex, $('#detailBody')); } }, 'Collapse all')].filter(x => x !== ''));
  const n = $('#detailNotice');
  if (!visible(ex)) n.replaceChildren('This request is hidden by the current filters.', h('button', { onclick: () => { F.force.add(ex.id); applyFilters(); revealRow(ex.id); } }, 'Show it in the list'));
  else n.replaceChildren();
}

function renderBody(ex, target) {
  ex.dom.secs = {}; ex.dom.replyBox = null; ex.dom.logBox = null; ex.dom.rawStatic = null;
  const secs = [];
  if (ex.kind === 'msg') {
    const r = ex.request;
    const P = S.ex.get(ex.prev);
    const sysTxt = systemText(r.system);
    secs.push(section(ex, 'system', SECTION_DEFAULTS.system, 'acc-system',
      () => [h('span', { class: 't' }, 'System instructions'), h('span', { class: 'hint' }, fmtBytes(utf8len(sysTxt))),
        typeof r.system === 'string' ? span('tag', 'string') : Array.isArray(r.system) ? span('tag', `${r.system.length} blocks`) : span('tag', 'none'),
        P && P.sysSig !== ex.sysSig ? span('chip warnc', 'Δ changed') : ''],
      () => renderSystem(ex)));
    const tools = Array.isArray(r.tools) ? r.tools : [];
    const same = P && P.toolsSig === ex.toolsSig;
    secs.push(section(ex, 'tools', SECTION_DEFAULTS.tools, 'acc-tools',
      () => [h('span', { class: 't' }, `Tool definitions (${tools.length})`), same ? h('span', { class: 'hint' }, '· same as ', exLink(P.id)) : '',
        P && !same ? span('chip warnc', 'Δ changed') : '', h('span', { class: 'hint' }, fmtBytes(utf8len(JSON.stringify(tools))))],
      () => renderTools(ex, tools, same ? P : null)));
    secs.push(section(ex, 'history', SECTION_DEFAULTS.history, 'acc-history',
      () => [h('span', { class: 't' }, `Conversation so far (${ex.newStart} message${ex.newStart === 1 ? '' : 's'})`)],
      () => ex.newStart ? renderMessages(ex, r.messages.slice(0, ex.newStart), 0, 'history') : h('div', { class: 'muted' }, 'nothing before this request')));
    const nm = newMsgs(ex);
    secs.push(section(ex, 'new', SECTION_DEFAULTS.new, 'acc-new',
      () => [h('span', { class: 't' }, `New in this request (${nm.length})`), P ? h('span', { class: 'hint' }, 'since ', exLink(P.id)) : h('span', { class: 'hint' }, 'first request of the thread')],
      () => renderMessages(ex, nm, ex.newStart, 'new')));
    secs.push(section(ex, 'reply', SECTION_DEFAULTS.reply, 'acc-reply',
      () => [h('span', { class: 't' }, 'Reply'), h('span', { class: 'hint' }, `${ex.blocks.filter(Boolean).length} block(s)`), ex.resp?.stop_reason ? span('tag', ex.resp.stop_reason) : ''],
      () => renderReply(ex)));
    secs.push(section(ex, 'changes', SECTION_DEFAULTS.changes, 'acc-changes',
      () => [h('span', { class: 't' }, 'Changes since previous request'), h('span', { class: 'hint' }, changesHint(ex))],
      () => renderChanges(ex)));
  }
  secs.push(section(ex, 'stats', SECTION_DEFAULTS.stats, 'acc-stats',
    () => [h('span', { class: 't' }, 'Stats'), h('span', { class: 'hint' }, ex.resp?.usage ? `${fmtTok(tokIn(ex.resp.usage))} in · ${fmtTok(ex.resp.usage.output_tokens || 0)} out · ${fmtCost(costOf(ex))}` : '')],
    () => renderStats(ex)));
  secs.push(section(ex, 'raw', ex.kind !== 'msg' ? true : SECTION_DEFAULTS.raw, 'acc-raw',
    () => [h('span', { class: 't' }, 'Raw'), h('span', { class: 'hint' }, `request ${fmtBytes(ex.reqBytes)} · response ${fmtBytes(ex.resp?.respBytes ?? 0)} · ${ex.log.length + ex.logOmitted} events`)],
    () => renderRaw(ex)));
  target.replaceChildren(...secs);
}

function systemText(s) {
  if (s == null) return '';
  if (typeof s === 'string') return s;
  if (Array.isArray(s)) return s.map(b => b.text ?? JSON.stringify(b)).join('\n\n');
  return JSON.stringify(s, null, 2);
}

function renderSystem(ex) {
  const s = ex.request.system;
  if (s == null) return h('div', { class: 'muted' }, 'no system instructions');
  if (typeof s === 'string') return longText(`${ex.id}:sys`, s, { lines: 15 });
  if (!Array.isArray(s)) return jsonTree(`${ex.id}:sysj`, s);
  return s.map((b, i) => h('div', { class: 'sysblock' },
    h('div', { style: 'margin-bottom:3px;display:flex;gap:6px' }, span('tag', `block ${i + 1} · ${b.type}`),
      b.cache_control ? span('tag', 'cache_control: ' + (b.cache_control.type || '') + (b.cache_control.ttl ? ' ' + b.cache_control.ttl : '')) : '',
      span('faint', fmtBytes(utf8len(b.text || '')))),
    b.type === 'text' ? longText(`${ex.id}:sys:${i}`, b.text || '', { lines: 15 }) : jsonTree(`${ex.id}:sys:${i}:j`, b)));
}

function renderTools(ex, tools, sameAs) {
  const list = () => tools.map((t, i) => {
    const key = `${ex.id}:tool:${i}`;
    const desc = t.description || '';
    return fold(key, false, () => [h('b', null, t.name || t.type), h('span', { class: 'muted sumtxt' }, trunc(firstLine(desc), 140)), t.type && t.type !== 'custom' && !t.input_schema ? span('tag', t.type) : ''],
      () => [desc ? longText(key + ':d', desc, { lines: 20 }) : '',
        t.input_schema ? [h('div', { class: 'faint', style: 'margin:6px 0 2px' }, 'input schema'), jsonTree(key + ':s', t.input_schema, 2)] : jsonTree(key + ':j', t, 2)]);
  });
  if (!tools.length) return h('div', { class: 'muted' }, 'no tools in this request');
  if (sameAs) return [h('div', { class: 'muted' }, 'Identical to the tools of ', exLink(sameAs.id), '.'),
    fold(`${ex.id}:tools:anyway`, false, [h('span', { class: 'faint' }, 'show the list anyway')], list)];
  return list();
}

// --- reply: keyed per block, so a streaming update replaces only the block that changed ---
function blockSig(ex, b) {

function visible(ex) {

  if (ex.kind === 'msg') { const th = S.threads.get(ex.thread); if (th && F.groups.get(th.group) === false) return false; }
  if (F.errorsOnly && !hasError(ex)) return false;
  if (F.tools.size) { if (ex.kind !== 'msg') return false; const n = toolNames(ex); if (![...F.tools].some(t => n.has(t))) return false; }

function applyVisibility(ex) { if (ex.dom) ex.dom.row.hidden = !visible(ex); }

// =====================================================================
function totals() {
  let req = 0, tin = 0, tout = 0, cost = 0, unknown = 0, apiErr = 0;
  for (const ex of S.ex.values()) {
    if (apiFailed(ex)) apiErr++;
    if (ex.kind !== 'msg') continue;
    req++;
    const u = ex.resp?.usage; if (!u) continue;
    tin += tokIn(u); tout += u.output_tokens || 0;
    const c = costOf(ex); if (c == null) { if (ex.done) unknown++; } else cost += c;
  }
  let toolErr = 0; for (const t of S.tools.values()) if (t.isError && S.ex.has(t.callEx ?? t.resultEx)) toolErr++;
  return { req, tin, tout, cost, unknown, apiErr, toolErr };
}

function renderHeader() {
  const T = totals();
  const inflight = [...S.ex.values()].filter(e => !e.done && !apiFailed(e));
  $('#inflight').textContent = inflight.length ? `· ${inflight.length} in flight (${fmtDur(Date.now() - Math.min(...inflight.map(e => e.t)))})` : '';
  $('#totals').replaceChildren('Requests ', h('b', null, String(T.req)), multiSession() ? ` (${S.sessions.size} sessions)` : '', ' · Tokens ', h('b', { title: exact(T.tin) }, fmtTok(T.tin)), ' in / ', h('b', { title: exact(T.tout) }, fmtTok(T.tout)), ' out · Cost ',
    h('b', { title: T.unknown ? `${T.unknown} request(s) with an unpriced model are not included` : `$${T.cost.toFixed(6)}` }, fmtCost(T.cost) + (T.unknown ? ' + ?' : '')));
  const n = T.apiErr + T.toolErr;
  const eb = $('#errBtn');
  eb.textContent = `Errors ${n}${n ? ' ⚠' : ''}` + (n ? ` (${T.apiErr} API · ${T.toolErr} tool)` : '');
  eb.classList.toggle('has', n > 0);
  $('#empty').hidden = S.ex.size > 0;
  $('#evictNote').textContent = S.evicted ? `${S.evicted} older request${S.evicted > 1 ? 's' : ''} evicted from the buffer` : '';
}

let statsOpen = false, lastStats = 0;
function renderStatsPanel(force) {
  if (!statsOpen) return;
  if (!force && Date.now() - lastStats < 1000) return;
  lastStats = Date.now();
  const p = $('#statsPanel');
  const T = totals();
  const msgs = [...S.ex.values()].filter(e => e.kind === 'msg').sort((a, b) => a.id - b.id);
  const agg = keyFn => {
    const m = new Map();
    for (const ex of msgs) {
      const k = keyFn(ex); let s = m.get(k); if (!s) m.set(k, s = { k, n: 0, tin: 0, tout: 0, cost: 0, unknown: false });
      s.n++; const u = ex.resp?.usage; if (u) { s.tin += tokIn(u); s.tout += u.output_tokens || 0; }
      const c = costOf(ex); if (c == null) { if (u) s.unknown = true; } else s.cost += c;
    }
    return [...m.values()];
  };
  const aggTable = (title, rows, nameFn) => h('div', null, h('h3', null, title), h('table', { class: 't' },
    h('tr', null, h('th', null, ''), h('th', { class: 'n' }, 'requests'), h('th', { class: 'n' }, 'in'), h('th', { class: 'n' }, 'out'), h('th', { class: 'n' }, 'cost')),
    rows.map(r => h('tr', null, h('td', null, nameFn(r.k)), h('td', { class: 'n' }, String(r.n)), h('td', { class: 'n', title: exact(r.tin) }, fmtTok(r.tin)),
      h('td', { class: 'n', title: exact(r.tout) }, fmtTok(r.tout)), h('td', { class: 'n' }, r.unknown && !r.cost ? '—' : fmtCost(r.cost) + (r.unknown ? ' + ?' : ''))))));
  const groupName = k => { const th = [...S.threads.values()].find(t => t.group === k); return th ? [sessTag(th.session), ' ', threadTag(th.kind === 'side' ? { ...th, name: 'side calls' } : th)] : k; };
  const ts = toolStats();
  const toolTable = h('div', null, h('h3', null, 'Tool usage (click to filter)'), ts.length ? h('table', { class: 't' },
    h('tr', null, h('th', null, 'tool'), h('th', { class: 'n' }, 'calls'), h('th', { class: 'n' }, 'errors'), h('th', { class: 'n' }, 'avg result'), h('th', { class: 'n' }, 'avg call→result')),
    ts.map(t => h('tr', { class: 'click' + (F.tools.has(t.name) ? ' sel' : ''), onclick: () => { toggleTool(t.name); renderStatsPanel(true); } },
      h('td', null, t.name), h('td', { class: 'n' }, String(t.calls)), h('td', { class: 'n' + (t.errors ? ' bad' : '') }, t.errors ? '✗ ' + t.errors : '0'),
      h('td', { class: 'n' }, t.nres ? fmtBytes(Math.round(t.size / t.nres)) : '—'), h('td', { class: 'n' }, t.ntime ? fmtDur(t.time / t.ntime) : '—')))) : h('div', { class: 'faint' }, 'no tool calls yet'));
  p.replaceChildren(
    h('div', null, h('h3', null, 'Session totals'), h('table', { class: 't' },
      h('tr', null, h('td', null, 'message requests'), h('td', { class: 'n' }, String(T.req))),
      h('tr', null, h('td', null, 'tokens in / out'), h('td', { class: 'n' }, `${fmtTok(T.tin)} / ${fmtTok(T.tout)}`)),
      h('tr', null, h('td', null, 'cost'), h('td', { class: 'n' }, fmtCost(T.cost) + (T.unknown ? ` + ? (${T.unknown} unpriced)` : ''))),
      h('tr', null, h('td', null, 'errors'), h('td', { class: 'n' + (T.apiErr + T.toolErr ? ' bad' : '') }, `${T.apiErr} API · ${T.toolErr} tool`))),
      h('div', { class: 'faint', style: 'margin-top:4px' }, `prices as of ${S.pricesAsOf}; unknown models show —`)),
    aggTable('By thread', agg(ex => S.threads.get(ex.thread)?.group), groupName),
    aggTable('By model', agg(ex => shortModel(modelOf(ex))), k => k),
    toolTable,
    h('div', null, h('h3', null, 'Input tokens per request'), barChart(msgs.slice(-150), ex => ex.resp?.usage ? tokIn(ex.resp.usage) : 0, fmtTok)),
    h('div', null, h('h3', null, 'Cost per request'), barChart(msgs.slice(-150), ex => costOf(ex) ?? 0, fmtCost)));
}

function barChart(items, valFn, fmt) {
  const wrap = h('div', { class: 'chart' });
  if (!items.length) { wrap.append(h('div', { class: 'faint' }, 'no data yet')); return wrap; }
  const W = Math.max(280, Math.min(($('#statsPanel').clientWidth || 600) / 2 - 40, 900)), H = 110, padB = 16, padT = 14;
  const vals = items.map(valFn), max = Math.max(...vals, 1e-9);
  const slot = W / items.length, bw = Math.max(1, slot - 2);
  const NS = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(NS, 'svg');
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`); svg.setAttribute('height', H);
  const el = (n, a) => { const e = document.createElementNS(NS, n); for (const [k, v] of Object.entries(a)) e.setAttribute(k, v); return e; };
  const base = H - padB;
  items.forEach((ex, i) => {
    const v = vals[i], bh = Math.max(v > 0 ? 1 : 0, (v / max) * (base - padT));
    const x = i * slot, y = base - bh, r = Math.min(4, bw / 2, bh);
    const hit = el('rect', { class: 'hit', x, y: padT, width: slot, height: base - padT });
    const bar = el('path', { class: 'bar', d: `M${x},${base} V${y + r} Q${x},${y} ${x + r},${y} H${x + bw - r} Q${x + bw},${y} ${x + bw},${y + r} V${base} Z` });
    hit.addEventListener('mousemove', e => showTip(e, `#${ex.id} · ${S.threads.get(ex.thread)?.name || ex.kind} · ${fmt(v)}`));
    hit.addEventListener('mouseleave', hideTip);
    hit.addEventListener('click', () => gotoEx(ex.id));
    svg.append(hit, bar);
  });
  svg.append(el('line', { class: 'axis', x1: 0, x2: W, y1: base + .5, y2: base + .5 }));
  const t1 = el('text', { class: 'axl', x: 0, y: 10 }); t1.textContent = 'max ' + fmt(max); svg.append(t1);
  const t2 = el('text', { class: 'axl', x: 0, y: H - 3 }); t2.textContent = '#' + items[0].id; svg.append(t2);
  const t3 = el('text', { class: 'axl', x: W, y: H - 3, 'text-anchor': 'end' }); t3.textContent = '#' + items[items.length - 1].id; svg.append(t3);
  wrap.append(svg);
  return wrap;
}
function showTip(e, text) { const t = $('#tip'); t.textContent = text; t.hidden = false; t.style.left = (e.clientX + 12) + 'px'; t.style.top = (e.clientY + 12) + 'px'; }
function hideTip() { $('#tip').hidden = true; }

// =====================================================================
// Rendering loop: updates are coalesced per animation frame and touch only affected regions
// =====================================================================
function markDirty(ex, ...what) {
  let s = S.dirty.get(ex.id); if (!s) S.dirty.set(ex.id, s = new Set());
  for (const w of what) s.add(w);
  scheduleFlush();
}
let flushQueued = false;
function scheduleFlush() { if (!flushQueued) { flushQueued = true; requestAnimationFrame(() => { flushQueued = false; flush(); }); } }
function flush() {
  if (S.replaying) return;  // render once the replay is complete
  const dirty = S.dirty; S.dirty = new Map();
  keepListAnchor(() => {
    for (const [id, what] of dirty) {
      const ex = S.ex.get(id); if (!ex?.dom) continue;
      renderRows(ex);
      applyVisibility(ex);
    }
  });
  const sel = dirty.get(V.selected);
  const ex = S.ex.get(V.selected);
  if (sel && ex && V.rendered === ex.id) {
    keepDetailAnchor(() => {
      if (sel.has('dhead')) renderDetailHead(ex);
      if (sel.has('reply')) patchReply(ex);
      if (sel.has('new')) ex.dom.secs.new?.();
      if (sel.has('stats')) ex.dom.secs.stats?.();
      if (sel.has('raw')) patchRaw(ex);
      if (sel.has('log')) patchLog(ex);
    });
  }
  renderHeader();
  if (S.sideDirty) { S.sideDirty = false; renderControls(); }
  renderStatsPanel();
}

// Keep what the reader is looking at in place when content above it changes.
// scrollTop is rounded to whole pixels while rows have fractional heights, so each correction aims at the
// offset intended when the reader last scrolled, not at the last measured one; rounding errors cannot add up.
const lastAnchor = new WeakMap();   // scroller -> { el, offset, st }
function keepAnchor(scroller, candidates, fn, threshold) {
  if (scroller.scrollTop < threshold) { lastAnchor.delete(scroller); fn(); return; }
  const top = scroller.getBoundingClientRect().top;
  let anchor = null, before = 0;
  for (const c of candidates()) {
    if (c.hidden || !c.offsetParent) continue;
    const r = c.getBoundingClientRect();
    if (r.bottom > top + 1) { anchor = c; before = r.top - top; break; }
  }
  const prev = lastAnchor.get(scroller);
  if (anchor && prev && prev.el === anchor && prev.st === scroller.scrollTop) before = prev.offset;
  fn();
  if (anchor && anchor.isConnected && !anchor.hidden) {
    const delta = anchor.getBoundingClientRect().top - scroller.getBoundingClientRect().top - before;
    if (Math.abs(delta) > 0.25) scroller.scrollTop += delta;
    lastAnchor.set(scroller, { el: anchor, offset: before, st: scroller.scrollTop });
  }
}
const keepListAnchor = fn => keepAnchor(listScroll, () => listEl.children, fn, 40);
const keepDetailAnchor = fn => keepAnchor($('#detailScroll'), () => $('#detailBody').querySelectorAll('.sechead, .msgs > *, .logbox'), fn, 1);
function listAnchor() {
  if (listScroll.scrollTop < 40) return null;
  const top = listScroll.getBoundingClientRect().top;
  for (const c of listEl.children) {
    if (c.hidden) continue;
    const r = c.getBoundingClientRect();
    if (r.bottom > top + 1) return { id: +c.dataset.id, offset: r.top - top };
  }
  return null;
}
function restoreListAnchor(a) {
  if (!a) return;
  const row = S.ex.get(a.id)?.dom?.row;
  if (!row || row.hidden) return;
  listScroll.scrollTop += row.getBoundingClientRect().top - listScroll.getBoundingClientRect().top - a.offset;
}

function updatePill() {
  const p = $('#pill');
  p.hidden = S.pending === 0;
  p.textContent = `↑ ${S.pending} new request${S.pending === 1 ? '' : 's'}`;
}
// Scrolls only the list; the selection does not change.
function toTop() { listScroll.scrollTop = 0; S.pending = 0; updatePill(); }

// =====================================================================
// Keyboard & controls
// =====================================================================
const visibleRows = () => [...listEl.children].filter(c => !c.hidden);
function moveSelection(dir) {
  const rows = visibleRows(); if (!rows.length) return;
  let i = rows.findIndex(c => +c.dataset.id === V.selected);
  const j = i < 0 ? 0 : Math.max(0, Math.min(rows.length - 1, i + dir));
  selectEx(+rows[j].dataset.id, { reveal: true });
}
function jumpError(dir) {
  const rows = visibleRows().filter(c => { const ex = S.ex.get(+c.dataset.id); return ex && hasError(ex); });
  if (!rows.length) { toast('no errors'); return; }
  let i = rows.findIndex(c => +c.dataset.id === V.selected);
  i = i < 0 ? (dir > 0 ? 0 : rows.length - 1) : (i + dir + rows.length) % rows.length;
  selectEx(+rows[i].dataset.id, { reveal: true });
}
document.addEventListener('keydown', e => {
  if (e.target.matches('input, textarea')) { if (e.key === 'Escape') e.target.blur(); return; }
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  switch (e.key) {
    case 'j': moveSelection(1); break;
    case 'k': moveSelection(-1); break;
    case 'o': case 'Enter': if (V.selected != null) selectEx(V.selected, { reveal: false, focusDetail: true }); break;
    case 'Home': e.preventDefault(); toTop(); break;
    case '/': e.preventDefault(); $('#search').focus(); break;
    case 'e': jumpError(1); break;
    case 'E': jumpError(-1); break;
    case 'Escape': if (document.body.classList.contains('show-detail')) showList(); break;
    default: return;
  }
});
listScroll.addEventListener('scroll', () => { if (listScroll.scrollTop < 40 && S.pending) { S.pending = 0; updatePill(); } }, { passive: true });
$('#pill').onclick = toTop;
$('#errBtn').onclick = () => { F.errorsOnly = !F.errorsOnly; applyFilters(); };
$('#fErrors').onchange = e => { F.errorsOnly = e.target.checked; applyFilters(); };
$('#fNonMsg').onchange = e => { F.showNonMsg = e.target.checked; applyFilters(); };
$('#kThinking').onchange = applyFilters;
$('#kReminders').onchange = applyFilters;
$('#ctlToggle').onclick = () => { const b = $('#ctlBody'); b.hidden = !b.hidden; $('#ctlToggle').setAttribute('aria-expanded', String(!b.hidden)); $('#ctlToggle').textContent = b.hidden ? 'Filters ▾' : 'Filters ▴'; };
let searchT = 0;
$('#search').oninput = e => { clearTimeout(searchT); searchT = setTimeout(() => { F.search = e.target.value.trim().toLowerCase(); F.force.clear(); applyFilters(); }, 150); };
$('#statsBtn').onclick = () => { statsOpen = !statsOpen; $('#statsPanel').hidden = !statsOpen; $('#statsBtn').textContent = statsOpen ? 'Stats ▴' : 'Stats ▾'; renderStatsPanel(true); };
document.head.append(h('style', { id: 'hlStyle' }));

// theme: auto -> light -> dark
const THEMES = ['auto', 'light', 'dark'];
let theme = 'auto';
try { theme = localStorage.getItem('traffic-theme') || 'auto'; } catch { /* storage unavailable */ }
function applyTheme() {
  if (theme === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.dataset.theme = theme;
  $('#themeBtn').textContent = '◐ ' + theme;
}
$('#themeBtn').onclick = () => { theme = THEMES[(THEMES.indexOf(theme) + 1) % 3]; try { localStorage.setItem('traffic-theme', theme); } catch { /* ignore */ } applyTheme(); };
applyTheme();

// Live timers for requests in flight: only the timer text changes; rows are redrawn when events arrive.
setInterval(() => {
  const live = [...S.ex.values()].filter(ex => !ex.done && ex.dom);
  if (live.length) keepListAnchor(() => {   // a longer timer text can wrap a row and change its height
    for (const ex of live) {
      const txt = fmtDur(Date.now() - ex.t);
      const l = ex.dom.head.querySelector('.lat'); if (l) l.textContent = txt;
      if (V.rendered === ex.id) { const d = $('#detailHead .lat'); if (d) d.textContent = txt; }
    }
  });
  if (live.length || $('#inflight').textContent) renderHeader();
}, 250);

// =====================================================================
// Connection
// =====================================================================
function connect() {
  if (S.es) S.es.close();  // never two streams at once (each would replay and double the events)
  const es = S.es = new EventSource('/events');
  const conn = $('#conn');
  es.onopen = () => { conn.className = 'live'; conn.textContent = 'live'; conn.title = ''; };
  // A dropped dashboard connection means "reconnecting", never that a request was interrupted.
  es.onerror = () => { conn.className = 'down'; conn.textContent = es.readyState === 2 ? 'disconnected' : 'reconnecting…'; conn.title = 'the dashboard lost its event stream; requests are unaffected'; if (es.readyState === 2) setTimeout(connect, 2000); };
  for (const name of ['ping', 'reset', 'replay_done', 'evicted', 'exchange_start', 'response_start', 'block_start', 'block_delta', 'block_stop', 'response_end', 'exchange_error'])
    es.addEventListener(name, e => { try { handle(name, JSON.parse(e.data)); } catch (err) { console.error('event', name, err); } });
}
connect();
renderHeader();
</script>
