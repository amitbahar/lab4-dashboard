<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Traffic</title>
<style>
:root {
  color-scheme: light;
  --bg: #f4f4f1; --panel: #fcfcfb; --panel2: #efeee9; --border: #dcdbd5; --border2: #c9c8c0;
  --text: #0b0b0b; --muted: #52514e; --faint: #85847e;
  --link: #1c64bd;
  --acc-prompt: #2a78d6; --acc-model: #1baf7a; --acc-thinking: #6250d6; --acc-reminder: #a3a29b;
  --acc-call: #eb6834; --acc-result: #6b6a64; --acc-media: #e87ba4;
  --bad: #c8302f; --bad-bg: #fcebea; --ok: #1f7a3a; --warn: #a86400; --warn-bg: #fff4dc;
  --sec-system: #6250d6; --sec-tools: #eda100; --sec-history: #a3a29b; --sec-new: #2a78d6;
  --sec-reply: #1baf7a; --sec-changes: #eb6834; --sec-stats: #008300; --sec-raw: #6b6a64;
  --series-1: #2a78d6;
  --diff-add: #e3f6e8; --diff-del: #fbe6e6;
  --fresh: #fff3c4;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, Ubuntu, sans-serif;
  --hh: 52px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #141413; --panel: #1c1c1b; --panel2: #252524; --border: #34342f; --border2: #45453f;
    --text: #f0efec; --muted: #c3c2b7; --faint: #8f8e86; --link: #7fb3f5;
    --acc-prompt: #3987e5; --acc-model: #199e70; --acc-thinking: #9085e9; --acc-reminder: #6d6c66;
    --acc-call: #d95926; --acc-result: #9a998f; --acc-media: #d55181;
    --bad: #ee6b6a; --bad-bg: #3a1d1c; --ok: #5cc27a; --warn: #e0a33a; --warn-bg: #3a2d12;
    --sec-system: #9085e9; --sec-tools: #c98500; --sec-history: #6d6c66; --sec-new: #3987e5;
    --sec-reply: #199e70; --sec-changes: #d95926; --sec-stats: #2f9a2f; --sec-raw: #9a998f;
    --series-1: #3987e5; --diff-add: #1c3324; --diff-del: #3d2020; --fresh: #3d3410;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #141413; --panel: #1c1c1b; --panel2: #252524; --border: #34342f; --border2: #45453f;
  --text: #f0efec; --muted: #c3c2b7; --faint: #8f8e86; --link: #7fb3f5;
  --acc-prompt: #3987e5; --acc-model: #199e70; --acc-thinking: #9085e9; --acc-reminder: #6d6c66;
  --acc-call: #d95926; --acc-result: #9a998f; --acc-media: #d55181;
  --bad: #ee6b6a; --bad-bg: #3a1d1c; --ok: #5cc27a; --warn: #e0a33a; --warn-bg: #3a2d12;
  --sec-system: #9085e9; --sec-tools: #c98500; --sec-history: #6d6c66; --sec-new: #3987e5;
  --sec-reply: #199e70; --sec-changes: #d95926; --sec-stats: #2f9a2f; --sec-raw: #9a998f;
  --series-1: #3987e5; --diff-add: #1c3324; --diff-del: #3d2020; --fresh: #3d3410;
}
* { box-sizing: border-box; }
html { overflow-anchor: none; }
body { margin: 0; background: var(--bg); color: var(--text); font: 13px/1.45 var(--sans); }
a, .link { color: var(--link); cursor: pointer; text-decoration: none; }
a:hover, .link:hover { text-decoration: underline; }
button { font: inherit; color: inherit; background: var(--panel2); border: 1px solid var(--border); border-radius: 5px; padding: 2px 8px; cursor: pointer; }
button:hover { border-color: var(--border2); }
pre { margin: 0; white-space: pre-wrap; word-break: break-word; }
.mono, code, pre.code { font-family: var(--mono); font-size: 12px; }
.muted { color: var(--muted); }
.faint { color: var(--faint); }
.bad { color: var(--bad); }
.ok { color: var(--ok); }
.warn { color: var(--warn); }

/* ---------- header ---------- */
#top { position: sticky; top: 0; z-index: 20; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px;
  padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--border); }
#conn { font-weight: 600; }
#conn.live::before { content: "● "; color: var(--ok); }
#conn.down::before { content: "● "; color: var(--bad); }
#inflight { color: var(--muted); }
#totals { color: var(--muted); }
#totals b { color: var(--text); font-weight: 600; }
.spacer { flex: 1; }
#errBtn.has { background: var(--bad-bg); border-color: var(--bad); color: var(--bad); font-weight: 600; }
#errBtn.active { outline: 2px solid var(--bad); }
#statsPanel { position: sticky; top: var(--hh); z-index: 15; max-height: 60vh; overflow: auto; background: var(--panel);
  border-bottom: 1px solid var(--border); padding: 12px 16px; display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 16px; }
#statsPanel[hidden] { display: none; }
#statsPanel h3 { margin: 0 0 6px; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
table.t { border-collapse: collapse; width: 100%; font-size: 12px; }
table.t th, table.t td { text-align: left; padding: 2px 8px 2px 0; border-bottom: 1px solid var(--border); vertical-align: top; }
table.t th { color: var(--muted); font-weight: 500; }
table.t td.n, table.t th.n { text-align: right; font-variant-numeric: tabular-nums; }
table.t tr.click { cursor: pointer; }
table.t tr.click:hover td { background: var(--panel2); }
table.t tr.sel td { background: var(--panel2); font-weight: 600; }

/* ---------- layout ---------- */
#layout { display: grid; grid-template-columns: 210px minmax(0, 1fr); gap: 16px; padding: 12px 16px 40px; }
#side { position: sticky; top: calc(var(--hh) + 12px); align-self: start; max-height: calc(100vh - var(--hh) - 24px); overflow: auto;
  background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; font-size: 12px; }
#side h4 { margin: 10px 0 4px; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
#side h4:first-child { margin-top: 0; }
#side label { display: flex; align-items: center; gap: 6px; padding: 1px 0; cursor: pointer; }
#side .toolrow { display: flex; justify-content: space-between; gap: 6px; padding: 1px 4px; border-radius: 4px; cursor: pointer; }
#side .toolrow:hover { background: var(--panel2); }
#side .toolrow.sel { background: var(--panel2); outline: 1px solid var(--border2); font-weight: 600; }
#side input[type=search] { width: 100%; font: inherit; color: inherit; background: var(--bg); border: 1px solid var(--border); border-radius: 5px; padding: 3px 6px; }
#side .keys { color: var(--faint); line-height: 1.7; }
kbd { font-family: var(--mono); font-size: 11px; border: 1px solid var(--border2); border-bottom-width: 2px; border-radius: 3px; padding: 0 3px; }
main { min-width: 0; }
#pill { position: fixed; top: calc(var(--hh) + 8px); left: 50%; transform: translateX(-50%); z-index: 10; display: block; background: var(--acc-prompt); color: #fff;
  border: none; border-radius: 999px; padding: 4px 14px; font-weight: 600; box-shadow: 0 2px 8px rgba(0,0,0,.2); }
#pill[hidden] { display: none; }
#empty { color: var(--muted); padding: 40px; text-align: center; }
#evictNote { color: var(--faint); text-align: center; padding: 12px; }
@media (max-width: 820px) {
  #layout { grid-template-columns: minmax(0, 1fr); padding: 12px 16px 40px; }
  #side { position: static; max-height: none; }
}

/* ---------- cards ---------- */
.card { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; margin-bottom: 8px; scroll-margin-top: calc(var(--hh) + 12px); }
.card.fresh { animation: fresh 1.6s ease-out; }
@keyframes fresh { from { background: var(--fresh); } to { background: var(--panel); } }
.card.focused { outline: 2px solid var(--acc-prompt); outline-offset: 1px; }
.card.flash { animation: fresh 1.2s ease-out; }
.card.haserr { border-left: 4px solid var(--bad); }
.card.expanded { border-color: var(--border2); }
.row { padding: 3px 12px; display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; cursor: pointer; min-width: 0; }
.row.head { padding-top: 7px; }
.row.replyrow { padding-bottom: 7px; }
.rowlab { font-size: 10px; font-weight: 700; letter-spacing: .06em; color: var(--faint); width: 44px; flex: none; }
.kind-nonmsg .row.head, .kind-generic .row.head { padding-bottom: 7px; }
.kind-nonmsg .newrow, .kind-nonmsg .replyrow, .kind-generic .newrow, .kind-generic .replyrow { display: none; }
.kind-nonmsg { opacity: .85; }
.id { font-weight: 700; font-variant-numeric: tabular-nums; }
.chip { display: inline-block; padding: 0 6px; border-radius: 4px; background: var(--panel2); border: 1px solid var(--border); font-size: 11.5px; white-space: nowrap; }
.chip.okc { color: var(--ok); }
.chip.badc { color: var(--bad); border-color: var(--bad); background: var(--bad-bg); font-weight: 600; }
.chip.warnc { color: var(--warn); border-color: var(--warn); background: var(--warn-bg); }
.chip.state-done { color: var(--muted); }
.chip.state-live { color: var(--acc-prompt); border-color: var(--acc-prompt); }
.ttag { display: inline-block; padding: 0 6px; border-radius: 4px; font-size: 11.5px; font-weight: 600; border: 1px solid var(--tc); color: var(--text);
  background: color-mix(in srgb, var(--tc) 14%, transparent); white-space: nowrap; }
.num { font-variant-numeric: tabular-nums; color: var(--muted); white-space: nowrap; }
.sumtxt { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%; }
.sumrow { display: flex; flex-wrap: wrap; gap: 4px 10px; min-width: 0; flex: 1; }
.tchip { display: inline-flex; gap: 4px; align-items: baseline; padding: 0 6px; border-radius: 4px; border: 1px solid var(--acc-call);
  font-size: 12px; max-width: 420px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.tchip .arg { font-family: var(--mono); font-size: 11.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; }
.tchip.err { border-color: var(--bad); background: var(--bad-bg); }
.cursor { display: inline-block; width: .55em; height: 1.05em; vertical-align: text-bottom; background: var(--acc-model); animation: blink 1s steps(2) infinite; margin-left: 1px; }
@keyframes blink { 50% { opacity: 0; } }
.errbanner:empty { display: none; }
.errbanner { margin: 4px 12px 8px; padding: 5px 10px; background: var(--bad-bg); color: var(--bad); border: 1px solid var(--bad); border-radius: 5px; font-weight: 600; }
.errbanner div + div { margin-top: 2px; }
.body { border-top: 1px solid var(--border); padding: 8px 12px 12px; cursor: auto; }
.body:empty { display: none; }
.toolbar { display: flex; gap: 6px; justify-content: flex-end; margin-bottom: 6px; }

/* ---------- sections ---------- */
.sec { border: 1px solid var(--border); border-left: 4px solid var(--acc); border-radius: 6px; margin: 8px 0; background: var(--panel); }
.sechead { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; padding: 5px 10px; cursor: pointer; background: color-mix(in srgb, var(--acc) 9%, var(--panel)); border-radius: 0 5px 5px 0; }
.sec.open > .sechead { border-bottom: 1px solid var(--border); border-radius: 0 5px 0 0; }
.sechead .t { font-weight: 650; }
.sechead .hint { color: var(--muted); font-size: 12px; }
.secbody { padding: 8px 10px 10px; min-width: 0; }
.caret { display: inline-block; width: 1em; color: var(--faint); flex: none; }
.acc-system { --acc: var(--sec-system); } .acc-tools { --acc: var(--sec-tools); } .acc-history { --acc: var(--sec-history); }
.acc-new { --acc: var(--sec-new); } .acc-reply { --acc: var(--sec-reply); } .acc-changes { --acc: var(--sec-changes); }
.acc-stats { --acc: var(--sec-stats); } .acc-raw { --acc: var(--sec-raw); }
.tag { display: inline-block; font-size: 10.5px; padding: 0 5px; border-radius: 3px; border: 1px solid var(--border2); color: var(--muted); font-family: var(--mono); }
.fold { margin: 4px 0; }
.foldhead { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: baseline; cursor: pointer; padding: 2px 0; min-width: 0; }
.foldhead:hover { background: var(--panel2); }
.foldbody { padding: 4px 0 4px 16px; min-width: 0; }
.sysblock + .sysblock { margin-top: 10px; padding-top: 8px; border-top: 1px dashed var(--border); }
.lt { min-width: 0; }
.lt pre.prose { font-family: var(--sans); font-size: 13px; }
.more { margin-top: 4px; font-size: 11.5px; padding: 0 8px; color: var(--link); background: transparent; }
.copy { font-size: 11px; padding: 0 6px; }

/* ---------- message vocabulary ---------- */
.msgs { display: flex; flex-direction: column; gap: 6px; }
.msg { border-left: 3px solid var(--acc); padding: 3px 10px 4px; min-width: 0; }
.mlabel { font-size: 11px; font-weight: 700; color: var(--muted); letter-spacing: .03em; margin-bottom: 2px; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.k-prompt { --acc: var(--acc-prompt); background: color-mix(in srgb, var(--acc-prompt) 6%, transparent); }
.k-model { --acc: var(--acc-model); }
.k-reminder { --acc: var(--acc-reminder); border-left-style: dotted; margin-left: 18px; color: var(--muted); font-size: 12px; }
.k-thinking { --acc: var(--acc-thinking); border-left-style: dashed; margin-left: 18px; color: var(--muted); }
.k-result { --acc: var(--acc-result); margin-left: 18px; }
.k-result.err { --acc: var(--bad); }
.k-media { --acc: var(--acc-media); margin-left: 18px; font-size: 12px; }
.k-echo { --acc: var(--border2); color: var(--muted); font-size: 12px; }
.k-other { --acc: var(--border2); margin-left: 18px; }
body.hide-thinking .k-thinking, body.hide-thinking .sum-thinking { display: none; }
body.hide-reminders .k-reminder, body.hide-reminders .sum-reminder { display: none; }
.md p { margin: 0 0 6px; } .md p:last-child { margin-bottom: 0; }
.md ul, .md ol { margin: 2px 0 6px; padding-left: 22px; }
.md h3, .md h4, .md h5 { margin: 8px 0 4px; font-size: 13.5px; }
.md code { background: var(--panel2); padding: 0 3px; border-radius: 3px; }
.md pre.code { background: var(--panel2); padding: 6px 8px; border-radius: 4px; margin: 4px 0 6px; overflow-x: auto; }

/* ---------- tool call beside result ---------- */
.pair { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); border: 1px solid var(--border); border-radius: 6px; margin: 2px 0 2px 8px; }
.pair.err { border-color: var(--bad); box-shadow: 0 0 0 1px var(--bad); }
.pair.hl { outline: 2px solid var(--acc-call); outline-offset: 1px; }
.pcall, .pres { padding: 5px 10px 7px; min-width: 0; }
.pcall { border-left: 3px solid var(--acc-call); border-radius: 5px 0 0 5px; }
.pres { border-left: 1px solid var(--border); background: color-mix(in srgb, var(--acc-result) 5%, transparent); }
.pair.err .pres { background: var(--bad-bg); }
.phead { font-size: 12px; font-weight: 650; margin-bottom: 3px; display: flex; gap: 6px; flex-wrap: wrap; align-items: baseline; }
.phead .sub { font-weight: 400; color: var(--muted); }
.kv { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 1px 8px; font-size: 12px; }
.kv .k { color: var(--muted); font-family: var(--mono); font-size: 11.5px; }
.waiting { color: var(--muted); font-style: italic; }
@media (max-width: 900px) { .pair { grid-template-columns: minmax(0, 1fr); } .pres { border-left: none; border-top: 1px solid var(--border); } }

/* ---------- json ---------- */
.json { font-family: var(--mono); font-size: 12px; position: relative; background: var(--bg); border: 1px solid var(--border); border-radius: 5px; padding: 4px 8px; overflow-x: auto; }
.json > .copy { position: absolute; right: 4px; top: 4px; }
.jkids { padding-left: 16px; border-left: 1px dotted var(--border2); margin-left: 4px; }
.jrow { white-space: pre-wrap; word-break: break-word; }
.jtog { cursor: pointer; }
.jtog:hover { background: var(--panel2); }
.jk { color: var(--sec-system); }
.js { color: var(--ok); }
.jn { color: var(--acc-call); }
.jb { color: var(--acc-prompt); }
.jcount { color: var(--faint); font-style: italic; }

/* ---------- diff ---------- */
.diff { font-family: var(--mono); font-size: 12px; border: 1px solid var(--border); border-radius: 5px; overflow-x: auto; }
.diff div { white-space: pre-wrap; word-break: break-word; padding: 0 6px; }
.diff .a { background: var(--diff-add); } .diff .a::before { content: "+ "; color: var(--ok); }
.diff .d { background: var(--diff-del); } .diff .d::before { content: "- "; color: var(--bad); }
.diff .c::before { content: "  "; }
.diff .gap { color: var(--faint); font-style: italic; background: var(--panel2); }
.chg { margin: 4px 0 10px; }
.chg > .lbl { font-weight: 650; margin-bottom: 3px; }
.warnbox { background: var(--warn-bg); border: 1px solid var(--warn); color: var(--warn); border-radius: 5px; padding: 4px 8px; font-weight: 600; margin: 4px 0; }

/* ---------- charts ---------- */
.chart { position: relative; }
.chart svg { display: block; width: 100%; overflow: visible; }
.chart .bar { fill: var(--series-1); }
.chart .hit { fill: transparent; cursor: pointer; }
.chart .hit:hover + .bar, .chart .bar.hov { opacity: .75; }
.chart .axis { stroke: var(--border2); stroke-width: 1; }
.chart .axl { fill: var(--muted); font-size: 10.5px; font-family: var(--sans); }
#tip { position: fixed; z-index: 50; pointer-events: none; background: var(--panel); border: 1px solid var(--border2); border-radius: 5px; padding: 4px 8px; font-size: 12px; box-shadow: 0 2px 8px rgba(0,0,0,.18); }
#tip[hidden] { display: none; }
#toast { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); z-index: 60; background: var(--text); color: var(--bg); padding: 6px 14px; border-radius: 6px; }
#toast[hidden] { display: none; }
</style>
</head>
<body>
<header id="top">
  <span id="conn" class="down">connecting…</span>
  <span id="inflight"></span>
  <span class="spacer"></span>
  <span id="totals"></span>
  <button id="errBtn" title="Show only requests with errors (e / Shift+E to jump)">Errors 0</button>
  <button id="statsBtn">Stats ▾</button>
  <button id="expandAll" title="Expand every visible card">Expand all</button>
  <button id="collapseAll" title="Collapse every card">Collapse all</button>
  <button id="themeBtn" title="Theme: auto / light / dark">◐ auto</button>
</header>
<div id="statsPanel" hidden></div>
<div id="layout">
  <aside id="side">
    <h4>Search</h4>
    <input id="search" type="search" placeholder="text in new messages / reply  ( / )">
    <div id="sideDyn"></div>
    <h4>Kinds</h4>
    <label><input type="checkbox" id="kThinking" checked> 💭 thinking</label>
    <label><input type="checkbox" id="kReminders" checked> 🔔 reminders</label>
    <h4>Other</h4>
    <label><input type="checkbox" id="fErrors"> ⚠ errors only</label>
    <label><input type="checkbox" id="fNonMsg"> non-message requests <span id="nonMsgCount" class="faint"></span></label>
    <h4>Keys</h4>
    <div class="keys"><kbd>j</kbd>/<kbd>k</kbd> next/prev · <kbd>o</kbd> open<br><kbd>Home</kbd> newest · <kbd>/</kbd> search<br><kbd>e</kbd>/<kbd>E</kbd> next/prev error</div>
  </aside>
  <main>
    <button id="pill" hidden>↑ 0 new requests</button>
    <div id="feed"></div>
    <div id="empty">Waiting for traffic… start the agent with <code>ANTHROPIC_BASE_URL=http://localhost:8041 claude</code></div>
    <div id="evictNote"></div>
  </main>
</div>
<div id="tip" hidden></div>
<div id="toast" hidden></div>
<script>
'use strict';
// =====================================================================
// Helpers
// =====================================================================
const $ = (s, r = document) => r.querySelector(s);
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  if (attrs) for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k === 'text') el.textContent = v;
    else if (k === 'html') el.innerHTML = v;
    else if (k.startsWith('on')) el[k] = v;
    else if (k === 'style') el.style.cssText = v;
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const kid of kids.flat(Infinity)) {
    if (kid == null || kid === false || kid === '') continue;
    el.append(kid instanceof Node ? kid : document.createTextNode(String(kid)));
  }
  return el;
}
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmtTok = n => n == null ? '—' : n < 1000 ? String(n) : n < 1e6 ? (n / 1000).toFixed(1) + 'k' : (n / 1e6).toFixed(2) + 'M';
const fmtBytes = n => n == null ? '—' : n < 1024 ? n + ' B' : n < 1048576 ? (n / 1024).toFixed(1) + ' KB' : (n / 1048576).toFixed(1) + ' MB';
const fmtDur = ms => ms == null || isNaN(ms) ? '—' : ms < 1000 ? Math.round(ms) + 'ms' : ms < 60000 ? (ms / 1000).toFixed(1) + 's' : Math.floor(ms / 60000) + 'm' + String(Math.round(ms % 60000 / 1000)).padStart(2, '0') + 's';
const fmtCost = c => c == null ? '—' : c < 0.01 && c > 0 ? '$' + c.toFixed(4) : '$' + c.toFixed(2);
const fmtTime = t => new Date(t).toLocaleTimeString([], { hour12: false });
const fmtChars = n => n < 1000 ? n + ' chars' : (n / 1000).toFixed(1) + 'k chars';

  const el = h('div', { class: 'fold ' + cls });
  const draw = () => {
    const open = isOpen(key, def);
    const head = h('div', { class: 'foldhead', onclick: e => { if (e.target.closest('a,button,.link')) return; e.stopPropagation(); UI.set(key, !open); draw(); } },
      h('span', { class: 'caret' }, open ? '▾' : '▸'), typeof headFn === 'function' ? headFn() : headFn);

  const wrap = h('div', { class: 'lt' });
  const draw = () => {
    const open = isOpen(key, false);
    let shown = text;
    if (big && !open) { shown = all.slice(0, lines).join('\n'); if (shown.length > maxChars) shown = shown.slice(0, maxChars); }
    const content = md ? h('div', { class: 'md', html: mdRender(shown) }) : h('pre', { class: mono ? 'mono' : 'prose' }, shown);

    let t = esc(part);

    const para = [l]; i++;
    while (i < lines.length && lines[i].trim() && !special.test(lines[i])) para.push(lines[i++]);
    out.push(`<p>${para.map(mdInline).join('<br>')}</p>`);
  }
  close();
  return out.join('');
}

function jsonTree(key, value, openDepth = 2) {

}
function jnode(key, v, depth, name, openDepth) {
  const keyEl = name !== undefined ? [h('span', { class: 'jk' }, JSON.stringify(String(name))), ': '] : [];
  if (v === null || typeof v !== 'object') return h('div', { class: 'jrow' }, keyEl, jprim(key, v));
  const isArr = Array.isArray(v); const entries = isArr ? v.map((x, i) => [i, x]) : Object.entries(v);
  const [o, c] = isArr ? ['[', ']'] : ['{', '}'];
  if (!entries.length) return h('div', { class: 'jrow' }, keyEl, o + c);
  const el = h('div');
  const draw = () => {
    const open = isOpen(key, depth < openDepth);
    el.replaceChildren(h('div', { class: 'jrow jtog', onclick: e => { e.stopPropagation(); UI.set(key, !open); draw(); } },
      h('span', { class: 'caret' }, open ? '▾' : '▸'), keyEl, o,
      open ? '' : [h('span', { class: 'jcount' }, ` ${entries.length} ${isArr ? (entries.length === 1 ? 'item' : 'items') : (entries.length === 1 ? 'key' : 'keys')} `), c]));
    if (open) {
      const kids = h('div', { class: 'jkids' });
      const lim = isOpen(key + '#all', false) ? entries.length : 300;
      for (const [k, x] of entries.slice(0, lim)) kids.append(jnode(key + '/' + k, x, depth + 1, isArr ? undefined : k, openDepth));
      if (entries.length > lim) kids.append(h('button', { class: 'more', onclick: e => { e.stopPropagation(); UI.set(key + '#all', true); draw(); } }, `show ${entries.length - lim} more`));
      el.append(kids, h('div', { class: 'jrow' }, c));
    }

  draw();

}
function jprim(key, v) {
  if (typeof v === 'string') {
    if (v.length <= 160 && !v.includes('\n')) return h('span', { class: 'js' }, JSON.stringify(v));
    const el = h('span', { class: 'js' });
    const draw = () => {
      const open = isOpen(key, false);
      el.replaceChildren(open ? JSON.stringify(v) : JSON.stringify(v.slice(0, 160)).slice(0, -1) + '…"',
        ' ', h('button', { class: 'more', onclick: e => { e.stopPropagation(); UI.set(key, !open); draw(); } }, open ? 'clip' : `${fmtChars(v.length)} ▸`));
    };

function diffLines(a, b) {
  const A = String(a).split('\n'), B = String(b).split('\n');
  let p = 0; while (p < A.length && p < B.length && A[p] === B[p]) p++;
  let s = 0; while (s < A.length - p && s < B.length - p && A[A.length - 1 - s] === B[B.length - 1 - s]) s++;
  const a2 = A.slice(p, A.length - s), b2 = B.slice(p, B.length - s);
  const ops = A.slice(0, p).map(x => ({ t: 'c', s: x }));
  const n = a2.length, m = b2.length;
  if (n * m > 4e6) { a2.forEach(x => ops.push({ t: 'd', s: x })); b2.forEach(x => ops.push({ t: 'a', s: x })); }
  else {
    const dp = Array.from({ length: n + 1 }, () => new Uint32Array(m + 1));
    for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--)
      dp[i][j] = a2[i] === b2[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
    let i = 0, j = 0;
    while (i < n && j < m) {
      if (a2[i] === b2[j]) { ops.push({ t: 'c', s: a2[i] }); i++; j++; }
      else if (dp[i + 1][j] >= dp[i][j + 1]) ops.push({ t: 'd', s: a2[i++] });
      else ops.push({ t: 'a', s: b2[j++] });
    }
    while (i < n) ops.push({ t: 'd', s: a2[i++] });
    while (j < m) ops.push({ t: 'a', s: b2[j++] });
  }
  B.slice(B.length - s).forEach(x => ops.push({ t: 'c', s: x }));
  return ops;
}
function diffView(ops, ctx = 3) {
  const el = h('div', { class: 'diff' });
  const keep = new Uint8Array(ops.length);
  ops.forEach((o, i) => { if (o.t !== 'c') for (let k = Math.max(0, i - ctx); k <= Math.min(ops.length - 1, i + ctx); k++) keep[k] = 1; });
  let gap = 0;
  ops.forEach((o, i) => {
    if (!keep[i]) { gap++; return; }
    if (gap) { el.append(h('div', { class: 'gap' }, `… ${gap} unchanged line${gap > 1 ? 's' : ''}`)); gap = 0; }
    el.append(h('div', { class: o.t }, o.s));
  });
  if (gap) el.append(h('div', { class: 'gap' }, `… ${gap} unchanged line${gap > 1 ? 's' : ''}`));
  return el;
}

// =====================================================================
// Links between cards

function exLink(id, label) {
  return h('a', { class: 'link', onclick: e => { e.preventDefault(); e.stopPropagation(); gotoEx(id); } }, label || '#' + id);
}
function gotoEx(id, open = true) {
  const ex = S.ex.get(id);
  if (!ex) { toast(`#${id} is no longer in the buffer`); return; }
  if (!visible(ex)) { F.force.add(id); applyVisibility(ex); }

// =====================================================================
// Message vocabulary rendering
// =====================================================================
function label(icon, text, ...rest) { return h('div', { class: 'mlabel' }, `${icon} ${text}`, rest); }

function mediaEl(b) {
  const src = b.source || {};
  const size = src.data ? fmtBytes(Math.floor(src.data.length * 3 / 4)) : src.url ? src.url : '';
  return h('div', { class: 'msg k-media' }, `🖼 ${b.type}`, src.media_type ? ` · ${src.media_type}` : '', size ? ` · ${size}` : '', src.type ? ` · ${src.type}` : '');
}

function renderMessages(ex, msgs, offset, mode) {
  const list = h('div', { class: 'msgs' });
  // For the history view, results are found in the same request.
  const local = new Map();
  if (mode === 'history') for (const m of ex.request.messages) for (const b of blocksOf(m)) if (b.type === 'tool_result') local.set(b.tool_use_id, b);
  const localCalls = new Set();
  for (const m of msgs) if (m.role === 'assistant') for (const b of blocksOf(m)) if (b.type === 'tool_use') localCalls.add(b.id);
  if (!msgs.length) list.append(h('div', { class: 'muted' }, 'no new messages'));
  msgs.forEach((m, i) => {
    const idx = offset + i, base = `${ex.id}:${mode}:${idx}`;
    if (m.role === 'assistant') {
      if (mode === 'new' && ex.prev && idx === ex.newStart && !ex.rewrite && S.ex.has(ex.prev)) {
        list.append(h('div', { class: 'msg k-echo' }, '🤖 the previous reply, from ', exLink(ex.prev), ' (shown there)'));
        return;
      }
      blocksOf(m).forEach((b, bi) => list.append(assistantBlock(ex, b, `${base}:${bi}`, { local, mode })));
    } else {
      blocksOf(m).forEach((b, bi) => list.append(...[].concat(userBlock(ex, b, `${base}:${bi}`, mode, localCalls))));
    }
  });
  return list;
}

function userBlock(ex, b, key, mode, localCalls) {
  if (b.type === 'text') {
    return splitReminders(b.text || '').map((p, pi) => p.k === 'prompt'
      ? h('div', { class: 'msg k-prompt' }, label('👤', 'Prompt'), longText(`${key}:${pi}`, p.text, { lines: 40 }))
      : fold(`${key}:${pi}`, false, () => [h('span', { class: 'mlabel', style: 'margin:0' }, '🔔 Reminder'), h('span', { class: 'sumtxt muted' }, trunc(firstLine(p.text), 140)), h('span', { class: 'faint' }, fmtChars(p.text.length))],
        () => longText(`${key}:${pi}:t`, p.text, { lines: 40 }), 'msg k-reminder'));
  }
  if (b.type === 'tool_result') {
    const t = S.tools.get(b.tool_use_id) || {};
    const err = !!b.is_error, text = resultText(b);
    const name = t.name || '?', arg = mainArg(t.name, t.input);
    const nlines = text ? text.split('\n').length : 0;

      return h('div', { class: 'msg k-result' + (err ? ' err' : ''), 'data-tool': name }, h('span', { class: 'muted' }, `⚙ result for ▶ ${name}${arg ? ' · ' + trunc(arg, 60) : ''} `), status, h('span', { class: 'faint' }, ' (shown beside its call above)'));
    if (mode === 'new' && t.callEx && t.callEx !== ex.id && S.ex.has(t.callEx)) {

      return fold(key, false, () => [h('span', { class: 'mlabel', style: 'margin:0' }, '⚙ Result'), h('b', null, name), arg ? h('span', { class: 'mono muted sumtxt' }, trunc(arg, 80)) : '', status,
        h('span', { class: 'faint' }, `${nlines} line${nlines === 1 ? '' : 's'}`), h('span', null, '↖ from ', exLink(t.callEx))],

function assistantBlock(ex, b, key, { local, mode, live } = {}) {
  if (!b) return '';

      () => longText(key + ':t', txt || '(empty — the thinking text was not returned)', { lines: 40 }), 'msg k-thinking');

function inputView(key, input, partial, live) {

  }

function pairEl(ex, b, key, localRes, live) {
  const t = S.tools.get(b.id) || {};
  let res = localRes;
  if (!res && t.result) res = { result: t.result, exId: t.resultEx, t: t.resultT };
  const err = !!res?.result?.is_error;
  const name = b.name || t.name || '?';
  const call = S.agentCalls.find(c => c.toolUseId === b.id && c.thread);
  const th = call && S.threads.get(call.thread);

    h('div', { class: 'phead' }, `▶ ${name}`, th && th.ids.length ? h('span', { class: 'sub' }, exLink(th.ids[0], `↘ thread ${th.name}`)) : ''),
    inputView(key, b.input, b.partial, live && !b.done));

// =====================================================================
// Cards

const feed = $('#feed');

function addCard(ex) {
  const card = h('article', { class: 'card kind-' + ex.kind + (ex.fresh ? ' fresh' : ''), 'data-id': ex.id });
  ex.dom = { card, head: h('div', { class: 'row head' }), newRow: h('div', { class: 'row newrow' }), reply: h('div', { class: 'row replyrow' }),
    err: h('div', { class: 'errbanner' }), body: h('div', { class: 'body' }), secs: {} };
  card.append(ex.dom.head, ex.dom.newRow, ex.dom.reply, ex.dom.err, ex.dom.body);
  card.addEventListener('click', e => {
    if (e.target.closest('a,button,input,.body,.link')) return;
    if (window.getSelection()?.toString()) return;
    setFocus(ex); toggleCard(ex);
  });
  ex.expanded = isOpen(`${ex.id}:card`, false);
  renderRows(ex);
  if (ex.expanded) renderBody(ex);
  const vis = visible(ex);
  card.hidden = !vis;
  withAnchor(() => feed.prepend(card));
  if (vis && ex.fresh && window.scrollY > 40) { S.pending++; updatePill(); }
  if (ex.fresh) setTimeout(() => card.classList.remove('fresh'), 1700);
}

function toggleCard(ex, force) {
  ex.expanded = force ?? !ex.expanded;
  UI.set(`${ex.id}:card`, ex.expanded);
  renderRows(ex);
  if (ex.expanded) renderBody(ex); else { ex.dom.body.replaceChildren(); ex.dom.secs = {}; }
}

function renderRows(ex) {
  const d = ex.dom;
  d.card.classList.toggle('haserr', hasError(ex));
  d.card.classList.toggle('expanded', !!ex.expanded);
  d.head.replaceChildren(...headRow(ex));
  if (ex.kind === 'msg') {
    d.newRow.replaceChildren(h('span', { class: 'rowlab' }, 'NEW'), h('span', { class: 'sumrow' }, newSummary(ex)));
    d.reply.replaceChildren(h('span', { class: 'rowlab' }, 'REPLY'), h('span', { class: 'sumrow' }, replySummary(ex)));
  }
  d.err.replaceChildren(...ex.errors.map(e => h('div', null, errSummary(e))));
}

function threadTag(th) { return th ? h('span', { class: 'ttag', style: `--tc:${th.color}` }, th.name) : ''; }

function headRow(ex) {
  const out = [h('span', { class: 'caret' }, ex.expanded ? '▾' : '▸'), h('span', { class: 'id' }, '#' + ex.id), span('num', fmtTime(ex.t), new Date(ex.t).toISOString())];
  const st = state(ex);
  const status = ex.resp?.status;
  const lat = (ex.resp?.tEnd ?? Date.now()) - ex.t;
  if (ex.kind === 'msg') {
    const th = S.threads.get(ex.thread);
    out.push(threadTag(th));
    if (th?.startedBy && th.ids[0] === ex.id) out.push(h('span', { class: 'faint' }, exLink(th.startedBy.exId, `↖ started by #${th.startedBy.exId}`)));
    out.push(span('num', shortModel(modelOf(ex)), modelOf(ex)));
  } else {
    out.push(h('span', { class: 'ttag', style: `--tc:${NEUTRAL}` }, ex.kind === 'generic' ? 'unrecognised API' : 'other'), h('span', { class: 'mono' }, `${ex.method} ${ex.path}`));
  }
  if (status) out.push(span('chip ' + (status >= 400 ? 'badc' : 'okc'), String(status), ex.resp.reason || ''));
  out.push(span('num', fmtDur(lat), `${exact(Math.round(lat))} ms total`));
  const u = ex.resp?.usage;
  if (ex.kind === 'msg' && u) {
    const tin = tokIn(u);
    out.push(span('num', `${fmtTok(tin)}/${fmtTok(u.output_tokens || 0)}`,
      `input ${exact(u.input_tokens || 0)} · cache read ${exact(u.cache_read_input_tokens || 0)} · cache write ${exact(u.cache_creation_input_tokens || 0)} · output ${exact(u.output_tokens || 0)}`));
    if (u.cache_read_input_tokens || u.cache_creation_input_tokens)
      out.push(span('num faint', `cache ${fmtTok(u.cache_read_input_tokens || 0)}r/${fmtTok(u.cache_creation_input_tokens || 0)}w`));
    const c = costOf(ex);
    out.push(span('num', fmtCost(c), c == null ? `no price for ${modelOf(ex)}` : `$${c.toFixed(6)}`));
  }
  if (ex.resp?.stop_reason) out.push(span('num', ex.resp.stop_reason));
  out.push(span('chip ' + (st === 'error' ? 'badc' : st === 'done' ? 'state-done' : st === 'aborted' ? 'warnc' : 'state-live'), st === 'sending' || st === 'streaming' || st === 'thinking' ? (st === 'streaming' ? '⏳ streaming…' : st === 'thinking' ? '💭 thinking…' : '⏳ sending…') : st));
  if (ex.kind === 'msg') {
    const P = S.ex.get(ex.prev);
    if (P && (P.sysSig !== ex.sysSig || P.toolsSig !== ex.toolsSig))
      out.push(span('chip warnc', 'Δ ' + [P.sysSig !== ex.sysSig && 'system', P.toolsSig !== ex.toolsSig && 'tools'].filter(Boolean).join('+'), 'changed since #' + P.id));
    if (ex.rewrite) out.push(span('chip warnc', '⚠ history rewritten'));
    if (ex.calls.length) out.push(span('num', `${ex.calls.length} tool${ex.calls.length > 1 ? 's' : ''}`));
  }
  return out;
}

function newSummary(ex) {
  const prompts = [], results = [];
  let reminders = 0, media = 0, assistants = 0;
  for (const m of newMsgs(ex)) {
    if (m.role === 'assistant') { assistants++; continue; }
    for (const b of blocksOf(m)) {
      if (b.type === 'text') for (const p of splitReminders(b.text || '')) { if (p.k === 'prompt') prompts.push(p.text); else reminders++; }
      else if (b.type === 'tool_result') results.push(b);
      else if (b.type === 'image' || b.type === 'document') media++;
    }
  }
  const out = [];
  if (prompts.length) out.push(h('span', { class: 'sumtxt' }, `👤 "${trunc(prompts.map(firstLine).join(' ⏎ '), 140)}"`));
  if (results.length) {
    const items = results.slice(0, 6).map(b => {
      const n = S.tools.get(b.tool_use_id)?.name || '?';
      return h('span', { class: b.is_error ? 'bad' : '' }, `${n} ${b.is_error ? '✗' : '✓'}`);
    });
    const list = []; items.forEach((it, i) => { if (i) list.push(', '); list.push(it); });
    out.push(h('span', null, `⚙ ${results.length} result${results.length > 1 ? 's' : ''}: `, list, results.length > 6 ? ` +${results.length - 6}` : ''));
  }
  if (reminders) out.push(h('span', { class: 'muted sum-reminder' }, `🔔 ${reminders} reminder${reminders > 1 ? 's' : ''}`));
  if (media) out.push(h('span', { class: 'muted' }, `🖼 ${media}`));
  if (!out.length) out.push(h('span', { class: 'faint' }, assistants ? '(only the previous reply)' : '—'));
  return out;
}

function replySummary(ex) {
  const out = [];
  const blocks = ex.blocks.filter(Boolean);
  const st = state(ex);
  const live = !ex.done;
  const text = blocks.find(b => b.type === 'text' && b.text);
  const think = blocks.filter(b => b.type === 'thinking' || b.type === 'redacted_thinking');
  if (think.length) {
    const n = think.reduce((a, b) => a + (b.thinking || '').length, 0);
    out.push(h('span', { class: 'muted sum-thinking' }, think.some(b => b.type === 'redacted_thinking') && !n ? '💭 redacted' : `💭 ${fmtChars(n)}`));
  }
  if (text) out.push(h('span', { class: 'sumtxt' }, `🤖 "${trunc(firstLine(text.text).replace(/\*\*|__|`/g, ''), 160)}"`, live && st === 'streaming' && !text.done ? h('span', { class: 'cursor' }) : ''));
  for (const b of blocks.filter(b => b.type === 'tool_use')) {
    const t = S.tools.get(b.id) || {};
    const arg = mainArg(b.name, b.input, b.partial);
    const mark = t.result ? (t.isError ? ' ✗' : ' ✓') : t.missing ? ' ∅' : b.done ? ' ⏳' : ' …';
    out.push(h('span', { class: 'tchip' + (t.isError ? ' err' : ''), title: `${b.name} ${arg}` }, `▶ ${b.name}`, arg ? h('span', { class: 'arg' }, '· ' + arg) : '', mark));
  }
  if (!out.length) out.push(h('span', { class: 'faint' }, ex.errors.length ? 'no reply' : live ? '…' : '(empty)'));
  return out;
}

// --- expanded body ---------------------------------------------------
function section(ex, name, def, acc, titleFn, bodyFn) {
  const key = `${ex.id}:sec:${name}`;
  const el = h('section', { class: 'sec ' + acc });

function toolStats() {

  const inflight = [...S.ex.values()].filter(e => !e.done && !(e.errors.length && e.errors.some(x => x.kind === 'unreachable')));
  $('#inflight').textContent = inflight.length ? `· ${inflight.length} in flight (${fmtDur(Date.now() - Math.min(...inflight.map(e => e.t)))})` : '';
  $('#totals').replaceChildren('Requests ', h('b', null, String(T.req)), ' · Tokens ', h('b', { title: exact(T.tin) }, fmtTok(T.tin)), ' in / ', h('b', { title: exact(T.tout) }, fmtTok(T.tout)), ' out · Cost ',
    h('b', { title: T.unknown ? `${T.unknown} request(s) with an unpriced model are not included` : `$${T.cost.toFixed(6)}` }, fmtCost(T.cost) + (T.unknown ? ' + ?' : '')));
  const n = T.apiErr + T.toolErr;
  const eb = $('#errBtn');
  eb.textContent = `Errors ${n}${n ? ' ⚠' : ''}` + (n ? ` (${T.apiErr} API · ${T.toolErr} tool)` : '');
  eb.classList.toggle('has', n > 0);
  $('#empty').hidden = S.ex.size > 0;
  $('#evictNote').textContent = S.evicted ? `${S.evicted} older request${S.evicted > 1 ? 's' : ''} evicted from the buffer` : '';
}

let statsOpen = false, lastStats = 0;
function renderStatsPanel(force) {
  if (!statsOpen) return;
  if (!force && Date.now() - lastStats < 1000) return;
  lastStats = Date.now();
  const p = $('#statsPanel');
  const T = totals();
  const msgs = [...S.ex.values()].filter(e => e.kind === 'msg').sort((a, b) => a.id - b.id);
  const agg = keyFn => {
    const m = new Map();
    for (const ex of msgs) {
      const k = keyFn(ex); let s = m.get(k); if (!s) m.set(k, s = { k, n: 0, tin: 0, tout: 0, cost: 0, unknown: false });
      s.n++; const u = ex.resp?.usage; if (u) { s.tin += tokIn(u); s.tout += u.output_tokens || 0; }
      const c = costOf(ex); if (c == null) { if (u) s.unknown = true; } else s.cost += c;
    }
    return [...m.values()];
  };
  const aggTable = (title, rows, nameFn) => h('div', null, h('h3', null, title), h('table', { class: 't' },
    h('tr', null, h('th', null, ''), h('th', { class: 'n' }, 'requests'), h('th', { class: 'n' }, 'in'), h('th', { class: 'n' }, 'out'), h('th', { class: 'n' }, 'cost')),
    rows.map(r => h('tr', null, h('td', null, nameFn(r.k)), h('td', { class: 'n' }, String(r.n)), h('td', { class: 'n', title: exact(r.tin) }, fmtTok(r.tin)),
      h('td', { class: 'n', title: exact(r.tout) }, fmtTok(r.tout)), h('td', { class: 'n' }, r.unknown && !r.cost ? '—' : fmtCost(r.cost) + (r.unknown ? ' + ?' : ''))))));
  const threadName = k => { const th = S.threads.get(k); return th ? (th.kind === 'side' ? threadTag({ ...th, name: 'side calls' }) : threadTag(th)) : k; };
  const ts = toolStats();
  const toolTable = h('div', null, h('h3', null, 'Tool usage (click to filter)'), ts.length ? h('table', { class: 't' },
    h('tr', null, h('th', null, 'tool'), h('th', { class: 'n' }, 'calls'), h('th', { class: 'n' }, 'errors'), h('th', { class: 'n' }, 'avg result'), h('th', { class: 'n' }, 'avg call→result')),
    ts.map(t => h('tr', { class: 'click' + (F.tools.has(t.name) ? ' sel' : ''), onclick: () => { toggleTool(t.name); renderStatsPanel(true); } },
      h('td', null, t.name), h('td', { class: 'n' }, String(t.calls)), h('td', { class: 'n' + (t.errors ? ' bad' : '') }, t.errors ? '✗ ' + t.errors : '0'),
      h('td', { class: 'n' }, t.nres ? fmtBytes(Math.round(t.size / t.nres)) : '—'), h('td', { class: 'n' }, t.ntime ? fmtDur(t.time / t.ntime) : '—')))) : h('div', { class: 'faint' }, 'no tool calls yet'));
  const groupKey = ex => { const th = S.threads.get(ex.thread); return th?.kind === 'side' ? 'side:1' : ex.thread; };
  p.replaceChildren(
    h('div', null, h('h3', null, 'Session'), h('table', { class: 't' },
      h('tr', null, h('td', null, 'message requests'), h('td', { class: 'n' }, String(T.req))),
      h('tr', null, h('td', null, 'tokens in / out'), h('td', { class: 'n' }, `${fmtTok(T.tin)} / ${fmtTok(T.tout)}`)),
      h('tr', null, h('td', null, 'cost'), h('td', { class: 'n' }, fmtCost(T.cost) + (T.unknown ? ` + ? (${T.unknown} unpriced)` : ''))),
      h('tr', null, h('td', null, 'errors'), h('td', { class: 'n' + (T.apiErr + T.toolErr ? ' bad' : '') }, `${T.apiErr} API · ${T.toolErr} tool`))),
      h('div', { class: 'faint', style: 'margin-top:4px' }, `prices as of ${S.pricesAsOf}; unknown models show —`)),
    aggTable('By thread', agg(groupKey), threadName),
    aggTable('By model', agg(ex => shortModel(modelOf(ex))), k => k),
    toolTable,
    h('div', null, h('h3', null, 'Input tokens per request'), barChart(msgs.slice(-150), ex => ex.resp?.usage ? tokIn(ex.resp.usage) : 0, fmtTok)),
    h('div', null, h('h3', null, 'Cost per request'), barChart(msgs.slice(-150), ex => costOf(ex) ?? 0, fmtCost)));
}

function barChart(items, valFn, fmt) {
  const wrap = h('div', { class: 'chart' });
  if (!items.length) { wrap.append(h('div', { class: 'faint' }, 'no data yet')); return wrap; }
  const W = Math.max(280, Math.min(($('#statsPanel').clientWidth || 600) / 2 - 40, 900)), H = 110, padL = 0, padB = 16, padT = 14;
  const vals = items.map(valFn), max = Math.max(...vals, 1e-9);
  const slot = (W - padL) / items.length, bw = Math.max(1, slot - 2);
  const NS = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(NS, 'svg');
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`); svg.setAttribute('height', H);
  const el = (n, a) => { const e = document.createElementNS(NS, n); for (const [k, v] of Object.entries(a)) e.setAttribute(k, v); return e; };
  const base = H - padB;
  items.forEach((ex, i) => {
    const v = vals[i], bh = Math.max(v > 0 ? 1 : 0, (v / max) * (base - padT));
    const x = padL + i * slot, y = base - bh, r = Math.min(4, bw / 2, bh);
    const hit = el('rect', { class: 'hit', x, y: padT, width: slot, height: base - padT });
    const bar = el('path', { class: 'bar', d: `M${x},${base} V${y + r} Q${x},${y} ${x + r},${y} H${x + bw - r} Q${x + bw},${y} ${x + bw},${y + r} V${base} Z` });
    hit.addEventListener('mousemove', e => showTip(e, `#${ex.id} · ${threadNameText(ex)} · ${fmt(v)}`));
    hit.addEventListener('mouseleave', hideTip);
    hit.addEventListener('click', () => gotoEx(ex.id));
    svg.append(hit, bar);
  });
  svg.append(el('line', { class: 'axis', x1: 0, x2: W, y1: base + .5, y2: base + .5 }));
  const t1 = el('text', { class: 'axl', x: 0, y: 10 }); t1.textContent = 'max ' + fmt(max); svg.append(t1);
  const t2 = el('text', { class: 'axl', x: 0, y: H - 3 }); t2.textContent = '#' + items[0].id; svg.append(t2);
  const t3 = el('text', { class: 'axl', x: W, y: H - 3, 'text-anchor': 'end' }); t3.textContent = '#' + items[items.length - 1].id; svg.append(t3);
  wrap.append(svg);
  return wrap;
}
const threadNameText = ex => S.threads.get(ex.thread)?.name || ex.kind;
function showTip(e, text) { const t = $('#tip'); t.textContent = text; t.hidden = false; t.style.left = (e.clientX + 12) + 'px'; t.style.top = (e.clientY + 12) + 'px'; }
function hideTip() { $('#tip').hidden = true; }

// =====================================================================
// Rendering loop: deltas are coalesced per animation frame
// =====================================================================
function markDirty(ex, ...what) {
  let s = S.dirty.get(ex.id); if (!s) S.dirty.set(ex.id, s = new Set());
  for (const w of what) s.add(w);
  scheduleFlush();
}
let flushQueued = false;
function scheduleFlush() { if (!flushQueued) { flushQueued = true; requestAnimationFrame(flush); } }
function flush() {
  flushQueued = false;
  const dirty = S.dirty; S.dirty = new Map();
  withAnchor(() => {
    for (const [id, what] of dirty) {
      const ex = S.ex.get(id); if (!ex?.dom) continue;
      renderRows(ex);
      applyVisibility(ex);
      if (!ex.expanded) continue;
      if (what.has('all')) { renderBody(ex); continue; }
      if (what.has('reply')) ex.dom.secs.reply?.();
      if (what.has('stats')) ex.dom.secs.stats?.();
    }
  });
  renderHeader();
  if (S.sideDirty) { S.sideDirty = false; renderSidebar(); }
  renderStatsPanel();
}

// Keep what the reader is looking at in place when content above it changes.
function withAnchor(fn) {
  if (window.scrollY < 40) { fn(); return; }
  const top = $('#top').offsetHeight;
  let anchor = null, before = 0;
  for (const c of feed.children) {
    if (c.hidden) continue;
    const r = c.getBoundingClientRect();
    if (r.bottom > top + 4) { anchor = c; before = r.top; break; }
  }
  fn();
  if (anchor && anchor.isConnected && !anchor.hidden) {
    const after = anchor.getBoundingClientRect().top;
    if (Math.abs(after - before) > 0.5) window.scrollBy(0, after - before);
  }
}

function updatePill() {
  const p = $('#pill');
  p.hidden = S.pending === 0;
  p.textContent = `↑ ${S.pending} new request${S.pending === 1 ? '' : 's'}`;
}
function toTop() { window.scrollTo({ top: 0 }); S.pending = 0; updatePill(); }

// =====================================================================
// Keyboard & controls
// =====================================================================
const visibleCards = () => [...feed.children].filter(c => !c.hidden);
function setFocus(ex) {
  if (S.focus != null) S.ex.get(S.focus)?.dom?.card.classList.remove('focused');
  S.focus = ex?.id ?? null;
  ex?.dom?.card.classList.add('focused');
}
function focusMove(dir) {
  const cards = visibleCards(); if (!cards.length) return;
  let i = cards.findIndex(c => +c.dataset.id === S.focus);
  if (i < 0) { const top = $('#top').offsetHeight; i = cards.findIndex(c => c.getBoundingClientRect().bottom > top); i = Math.max(0, i) - (dir > 0 ? 1 : 0); if (dir < 0) i++; }
  const j = Math.max(0, Math.min(cards.length - 1, i + dir));
  const ex = S.ex.get(+cards[j].dataset.id);
  setFocus(ex); ex.dom.card.scrollIntoView({ block: 'nearest' });
}
function jumpError(dir) {
  const cards = visibleCards().filter(c => { const ex = S.ex.get(+c.dataset.id); return ex && hasError(ex); });
  if (!cards.length) { toast('no errors'); return; }
  let i = cards.findIndex(c => +c.dataset.id === S.focus);
  i = i < 0 ? (dir > 0 ? 0 : cards.length - 1) : (i + dir + cards.length) % cards.length;
  gotoEx(+cards[i].dataset.id, false);
}
document.addEventListener('keydown', e => {
  if (e.target.matches('input, textarea')) { if (e.key === 'Escape') e.target.blur(); return; }
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const fx = S.ex.get(S.focus);
  switch (e.key) {
    case 'j': focusMove(1); break;
    case 'k': focusMove(-1); break;
    case 'o': case 'Enter': if (fx) toggleCard(fx); break;
    case 'Home': e.preventDefault(); toTop(); break;
    case '/': e.preventDefault(); $('#search').focus(); break;
    case 'e': jumpError(1); break;
    case 'E': jumpError(-1); break;
    default: return;
  }
});
window.addEventListener('scroll', () => { if (window.scrollY < 40 && S.pending) { S.pending = 0; updatePill(); } }, { passive: true });
$('#pill').onclick = toTop;
$('#errBtn').onclick = () => { F.errorsOnly = !F.errorsOnly; applyFilters(); };
$('#fErrors').onchange = e => { F.errorsOnly = e.target.checked; applyFilters(); };
$('#fNonMsg').onchange = e => { F.showNonMsg = e.target.checked; applyFilters(); };
$('#kThinking').onchange = applyFilters;
$('#kReminders').onchange = applyFilters;
let searchT = 0;
$('#search').oninput = e => { clearTimeout(searchT); searchT = setTimeout(() => { F.search = e.target.value.trim().toLowerCase(); F.force.clear(); applyFilters(); }, 150); };
$('#statsBtn').onclick = () => { statsOpen = !statsOpen; $('#statsPanel').hidden = !statsOpen; $('#statsBtn').textContent = statsOpen ? 'Stats ▴' : 'Stats ▾'; renderStatsPanel(true); };
$('#expandAll').onclick = () => withAnchor(() => { for (const ex of S.ex.values()) if (!ex.dom.card.hidden && !ex.expanded) toggleCard(ex, true); });
$('#collapseAll').onclick = () => withAnchor(() => { for (const ex of S.ex.values()) if (ex.expanded) toggleCard(ex, false); });
document.head.append(h('style', { id: 'hlStyle' }));

// theme: auto -> light -> dark
const THEMES = ['auto', 'light', 'dark'];
let theme = 'auto';
try { theme = localStorage.getItem('traffic-theme') || 'auto'; } catch { /* storage unavailable */ }
function applyTheme() {
  if (theme === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.dataset.theme = theme;
  $('#themeBtn').textContent = '◐ ' + theme;
}
$('#themeBtn').onclick = () => { theme = THEMES[(THEMES.indexOf(theme) + 1) % 3]; try { localStorage.setItem('traffic-theme', theme); } catch { /* ignore */ } applyTheme(); };
applyTheme();

function setHH() { document.documentElement.style.setProperty('--hh', $('#top').offsetHeight + 'px'); }
window.addEventListener('resize', setHH); setHH();

// live timers for requests in flight
setInterval(() => {
  let any = false;
  for (const ex of S.ex.values()) if (!ex.done && ex.dom) { ex.dom.head.replaceChildren(...headRow(ex)); any = true; }
  if (any || $('#inflight').textContent) renderHeader();
}, 250);

// =====================================================================
// Connection
// =====================================================================
function connect() {
  const es = new EventSource('/events');
  const conn = $('#conn');
  es.onopen = () => { conn.className = 'live'; conn.textContent = 'live'; };
  es.onerror = () => { conn.className = 'down'; conn.textContent = es.readyState === 2 ? 'disconnected' : 'reconnecting…'; if (es.readyState === 2) setTimeout(connect, 2000); };
  for (const name of ['reset', 'replay_done', 'evicted', 'exchange_start', 'response_start', 'block_start', 'block_delta', 'block_stop', 'response_end', 'exchange_error'])
    es.addEventListener(name, e => { try { handle(name, JSON.parse(e.data)); } catch (err) { console.error('event', name, err); } });
}
connect();
renderHeader();
</script>
